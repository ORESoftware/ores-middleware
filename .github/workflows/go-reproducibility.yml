name: go-reproducibility

on:
  pull_request:
    paths:
      - src/golang/**
      - .github/workflows/go-reproducibility.yml
  push:
    branches: [main, dev]
    paths:
      - src/golang/**
      - .github/workflows/go-reproducibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Install Go 1.25.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.0"
          cache: false

      - name: Verify module graph is canonical and immutable
        shell: bash
        working-directory: src/golang
        env:
          GOFLAGS: ""
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify

      - name: Require canonical gofmt output
        shell: bash
        working-directory: src/golang
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Go files requiring gofmt:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Vet all Go packages
        shell: bash
        working-directory: src/golang
        run: |
          set -euo pipefail
          go vet ./...

      - name: Run randomized race tests twice
        shell: bash
        working-directory: src/golang
        run: |
          set -euo pipefail
          go test -race -shuffle=on -count=2 ./...

      - name: Require pure Go runtime descriptor
        shell: bash
        working-directory: src/golang
        run: |
          set -euo pipefail
          descriptor="$(go run ./cmd/contractcheck)"
          printf '%s\n' "$descriptor" | grep -Eq '"language"[[:space:]]*:[[:space:]]*"golang"'
          printf '%s\n' "$descriptor" | grep -Eq '"contractVersion"[[:space:]]*:[[:space:]]*"1\.0\.0"'

      - name: Prove validation did not rewrite tracked Go source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code -- src/golang
