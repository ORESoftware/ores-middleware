name: contract-conformance

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: contract-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: npm ci
      - run: npm run contracts:compile
      - run: npm run contracts:check
      - run: node scripts/check-source-layout.mjs
      - run: cargo fmt --manifest-path tools/contract-parity/Cargo.toml -- --check
      - run: cargo test --manifest-path tools/contract-parity/Cargo.toml --all-targets
      - run: cargo run --quiet --manifest-path tools/contract-parity/Cargo.toml --
      - run: python3 -m unittest scripts/test_schema_convergence.py -v
      - run: python3 -m unittest scripts/test_orm_matrix_gate.py -v
      - run: python3 -m unittest scripts/test_cross_translation.py -v
      - run: python3 scripts/cross_translate.py
      - run: python3 scripts/check_zpkg.py
      - run: npx tsp compile contracts/docs-serving.tsp --no-emit
      - run: node scripts/validate-docs-serving.mjs
      - run: python3 scripts/test-rollout-rust-server.py
      - name: Upload translation and independent polyglot generation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-generation-${{ github.run_id }}
          path: |
            target/audit/cross-translation.json
            target/discrepancies/cross-translation.json
            target/cross-translation/**/*.json
            target/cross-translation/**/*.tsp
            target/schema-convergence/**/*
          if-no-files-found: error
          retention-days: 90

  generated-polyglot:
    name: generated-polyglot
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
          gleam-version: '1.18.1'
          rebar3-version: 'latest'
      - name: Install TypeScript compiler and protobuf compiler
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/ts
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends protobuf-compiler
      - name: Generate both independent authority lanes
        run: npm run contracts:polyglot-generate
      - name: Validate receipts, identical common artifacts, and JavaScript behavior
        run: npm run contracts:generated-check
      - name: Compile generated TypeScript declarations
        shell: bash
        run: |
          set -euo pipefail
          cat > target/schema-convergence/tsconfig.generated.json <<'JSON'
          {
            "compilerOptions": {
              "strict": true,
              "noEmit": true,
              "skipLibCheck": false,
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext"
            },
            "files": [
              "typespec/typescript/idempotency_record.d.ts",
              "json-schema-openapi/typescript/idempotency_record.d.ts"
            ]
          }
          JSON
          src/ts/node_modules/.bin/tsc -p target/schema-convergence/tsconfig.generated.json
      - name: Compile generated Rust and Go code from both lanes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/generated-compile/rust target/generated-compile/go
          for lane in typespec json-schema-openapi; do
            mkdir -p "target/generated-compile/rust/${lane}"
            rustc \
              --edition 2024 \
              --crate-type lib \
              "target/schema-convergence/${lane}/rust/idempotency_record.rs" \
              --out-dir "target/generated-compile/rust/${lane}"
            test -z "$(gofmt -d "target/schema-convergence/${lane}/golang/idempotency_record.go")"
            (
              cd "target/schema-convergence/${lane}/golang"
              GO111MODULE=off go test
            )
          done
      - name: Compile TypeSpec protobuf output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/generated-compile/protobuf
          protoc \
            --proto_path=target/schema-convergence/typespec/protobuf \
            --proto_path=/usr/include \
            --descriptor_set_out=target/generated-compile/protobuf/idempotency_record.pb \
            target/schema-convergence/typespec/protobuf/idempotency_record.proto
      - name: Compile generated Gleam, Elixir, and Erlang code from both lanes
        shell: bash
        run: |
          set -euo pipefail
          cp target/schema-convergence/typespec/gleam/idempotency_record.gleam \
            src/gleam/src/generated_typespec_idempotency_record.gleam
          cp target/schema-convergence/json-schema-openapi/gleam/idempotency_record.gleam \
            src/gleam/src/generated_json_schema_idempotency_record.gleam
          (
            cd src/gleam
            gleam format --check src
            gleam test
          )
          for lane in typespec json-schema-openapi; do
            mkdir -p "target/generated-compile/elixir/${lane}"
            elixirc \
              -o "target/generated-compile/elixir/${lane}" \
              "target/schema-convergence/${lane}/elixir/idempotency_record.ex"
            mkdir -p "target/generated-compile/erlang/${lane}"
            erlc \
              -o "target/generated-compile/erlang/${lane}" \
              "target/schema-convergence/${lane}/erlang/idempotency_record.erl"
          done
      - name: Upload independently compiled polyglot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-polyglot-${{ github.run_id }}
          path: |
            target/schema-convergence/**/*
            target/generated-compile/**/*
          if-no-files-found: error
          retention-days: 90

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: rustfmt --edition 2024 --check src/rust/src/docs_serving.rs
      - run: cargo fmt --manifest-path tools/contract-parity/Cargo.toml -- --check
      - run: cargo test --manifest-path tools/contract-parity/Cargo.toml --all-targets
      - run: cargo test --manifest-path src/rust/Cargo.toml --all-features
      - run: cargo run --quiet --manifest-path src/rust/Cargo.toml --bin contractcheck | jq -e '.language == "rust"'

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - run: npm ci --prefix src/ts
      - run: npm --prefix src/ts test
      - run: node src/ts/dist/contractcheck.js | jq -e '.language == "ts"'

  golang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: false
      - name: Verify committed Go module metadata
        run: cd src/golang && go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Run Go tests with race detector and randomized order
        run: cd src/golang && go test -race -shuffle=on -count=2 ./...
      - run: cd src/golang && go run ./cmd/contractcheck | jq -e '.language == "golang"'

  beam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
          gleam-version: '1.18.1'
          rebar3-version: 'latest'
      - run: cd src/gleam && gleam format --check src test && gleam test
      - run: cd src/gleam && gleam run -m ores_middleware_contractcheck | jq -e '.language == "gleam"'
      - run: cd src/elixir && mix deps.get && mix test
      - run: cd src/elixir && MIX_ENV=test mix run --no-compile --no-deps-check --no-start -e 'IO.puts(OresMiddleware.descriptor_json())' | jq -e '.language == "elixir"'
      - run: cd src/erlang && rebar3 eunit
      - run: cd src/erlang && escript escript/contractcheck.escript | jq -e '.language == "erlang"'
