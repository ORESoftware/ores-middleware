name: contract-conformance

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: contract-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm run contracts:compile
      - run: npm run contracts:check
      - run: node scripts/check-source-layout.mjs
      - run: python3 -m unittest scripts/test_contract_parity.py -v
      - run: python3 scripts/check_contract_parity.py
      - run: npx tsp compile contracts/docs-serving.tsp --no-emit
      - run: node scripts/validate-docs-serving.mjs
      - run: python3 scripts/test-rollout-rust-server.py

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: rustfmt --edition 2024 --check src/rust/src/docs_serving.rs
      - run: cargo test --manifest-path src/rust/Cargo.toml --all-features
      - run: cargo run --quiet --manifest-path src/rust/Cargo.toml --bin contractcheck | jq -e '.language == "rust"'

  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - run: npm ci --prefix src/ts
      - run: npm --prefix src/ts test
      - run: node src/ts/dist/contractcheck.js | jq -e '.language == "ts"'

  golang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: false
      - name: Verify committed Go module metadata
        run: cd src/golang && go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: cd src/golang && go test ./...
      - run: cd src/golang && go run ./cmd/contractcheck | jq -e '.language == "golang"'

  beam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          elixir-version: '1.18'
          gleam-version: 'latest'
          rebar3-version: 'latest'
      - run: cd src/gleam && gleam format --check src test && gleam test
      - run: cd src/gleam && gleam run -m ores_middleware_contractcheck | jq -e '.language == "gleam"'
      - run: cd src/elixir && mix deps.get && mix test
      - run: cd src/elixir && MIX_ENV=test mix run --no-compile --no-deps-check --no-start -e 'IO.puts(OresMiddleware.descriptor_json())' | jq -e '.language == "elixir"'
      - run: cd src/erlang && rebar3 eunit
      - run: cd src/erlang && escript escript/contractcheck.escript | jq -e '.language == "erlang"'
