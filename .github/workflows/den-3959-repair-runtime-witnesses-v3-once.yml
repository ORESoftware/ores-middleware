name: Repair DEN-3959 native runtime witnesses v3 once

on:
  push:
    branches:
      - feat/den-3959-independent-polyglot-generators
    paths:
      - .github/workflows/den-3959-repair-runtime-witnesses-v3-once.yml

permissions:
  contents: write

concurrency:
  group: den-3959-repair-runtime-witnesses-v3-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ORESoftware/ores-middleware'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3.4.14'
          elixir-version: '1.18.4'
          gleam-version: '1.18.1'
          rebar3-version: '3.24.0'
      - name: Repair defects at their owning layers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('tools/contract-parity/src/bin/persistence_codegen.rs')
          text = generator.read_text(encoding='utf-8')

          gleam_start = text.index('fn render_gleam(model: &Model) -> String {')
          gleam_end = text.index('\nfn elixir_type', gleam_start)
          gleam_section = text[gleam_start:gleam_end]
          old_gleam_signature = (
              'pub fn idempotency_status_from_string(value: String) '
              '-> Result(IdempotencyStatus, Nil) {{\\n'
          )
          new_gleam_signature = (
              'pub fn idempotency_status_from_string(\\n'
              '  value: String,\\n'
              ') -> Result(IdempotencyStatus, Nil) {{\\n'
          )
          if gleam_section.count(old_gleam_signature) != 1:
              raise SystemExit(
                  'expected exactly one generated Gleam status signature; '
                  f'found {gleam_section.count(old_gleam_signature)}'
              )
          gleam_section = gleam_section.replace(
              old_gleam_signature,
              new_gleam_signature,
              1,
          )
          text = text[:gleam_start] + gleam_section + text[gleam_end:]

          erlang_start = text.index('fn render_erlang(model: &Model) -> String {')
          status_start = text.index('    let status_type = enum_values\n', erlang_start)
          clauses_start = text.index('    let clauses = enum_values\n', status_start)
          legacy_status_block = text[status_start:clauses_start]
          for fragment in (
              '.map(|value| format!("<<\\\"{value}\\\">>"))',
              '.join(" | ");',
          ):
              if fragment not in legacy_status_block:
                  raise SystemExit(
                      f'generated Erlang status renderer missing expected fragment: {fragment}'
                  )
          replacement_status_block = (
              '    // Erlang types cannot express singleton binary literals. The wire\n'
              '    // vocabulary remains exact in valid_idempotency_status/1 below.\n'
              '    let status_type = "binary()";\n'
          )
          text = text[:status_start] + replacement_status_block + text[clauses_start:]
          generator.write_text(text, encoding='utf-8')

          rust_witness = Path('tests/generated-runtime/rust/src/main.rs')
          rust_text = rust_witness.read_text(encoding='utf-8')
          for old, new in (
              ('optional_string(object, "responseBody")??',
               'optional_string(object, "responseBody")?'),
              ('optional_i32(object, "responseStatus")??',
               'optional_i32(object, "responseStatus")?'),
          ):
              if rust_text.count(old) != 1:
                  raise SystemExit(f'expected exactly one Rust witness expression: {old}')
              rust_text = rust_text.replace(old, new, 1)
          rust_witness.write_text(rust_text, encoding='utf-8')

          elixir_witness = Path('tests/generated-runtime/elixir_witness.exs')
          elixir_text = elixir_witness.read_text(encoding='utf-8')
          anchor = '  def main([fixture_path, generated_path, authority]) do\n'
          normalization = '  def main(["--" | arguments]), do: main(arguments)\n\n'
          if elixir_text.count(anchor) != 1:
              raise SystemExit(
                  f'expected exactly one Elixir main clause; found {elixir_text.count(anchor)}'
              )
          if normalization.strip() in elixir_text:
              raise SystemExit('Elixir argument-normalization clause already exists')
          elixir_witness.write_text(
              elixir_text.replace(anchor, normalization + anchor, 1),
              encoding='utf-8',
          )
          PY
          rustfmt --edition 2024 tools/contract-parity/src/bin/persistence_codegen.rs
          generated_stub=tests/generated-runtime/rust/src/generated.rs
          test ! -e "$generated_stub"
          trap 'rm -f "$generated_stub"' EXIT
          printf '%s\n' '// temporary rustfmt-only module stub' > "$generated_stub"
          rustfmt --edition 2024 tests/generated-runtime/rust/src/main.rs
          rm -f "$generated_stub"
          trap - EXIT
          gleam format tests/generated-runtime/gleam/src/runtime_witness.gleam
          test ! -e "$generated_stub"
      - name: Install exact JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund
      - name: Prove both authorities across all six native runtimes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml -- --check
          cargo test --manifest-path tools/contract-parity/Cargo.toml --all-targets
          npm run contracts:polyglot-generate
          npm run contracts:generated-check
          node scripts/generated_runtime_matrix.mjs
          jq -e '
            .schema == "ores.generated-runtime-convergence-report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            ([.witnesses[] | select(.state == "executed")] | length) == 12
          ' target/generated-runtime-convergence/receipt.json
          for lane in typespec json-schema-openapi; do
            mkdir -p "target/gleam-format/${lane}/src"
            cp "target/schema-convergence/${lane}/gleam/idempotency_record.gleam" \
              "target/gleam-format/${lane}/src/idempotency_record.gleam"
            cp tests/generated-runtime/gleam/gleam.toml \
              "target/gleam-format/${lane}/gleam.toml"
            (
              cd "target/gleam-format/${lane}"
              gleam format --check src
            )
          done
      - name: Commit only proven source repairs and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/contract-parity/src/bin/persistence_codegen.rs \
            tests/generated-runtime/rust/src/main.rs \
            tests/generated-runtime/gleam/src/runtime_witness.gleam \
            tests/generated-runtime/elixir_witness.exs
          git rm --ignore-unmatch -- \
            .github/workflows/den-3959-repair-runtime-witnesses-v2-once.yml \
            .github/workflows/den-3959-repair-runtime-witnesses-v3-once.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(tools/contract-parity/src/bin/persistence_codegen.rs|tests/generated-runtime/rust/src/main.rs|tests/generated-runtime/gleam/src/runtime_witness.gleam|tests/generated-runtime/elixir_witness.exs|\.github/workflows/den-3959-repair-runtime-witnesses-v2-once\.yml|\.github/workflows/den-3959-repair-runtime-witnesses-v3-once\.yml)$' || true)"
          test -z "$unexpected"
          test ! -e tests/generated-runtime/rust/src/generated.rs
          git commit -m 'fix(DEN-3959): prove all generated native runtime witnesses'
          git fetch origin feat/den-3959-independent-polyglot-generators
          remote_tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            git merge --no-ff --no-edit "$remote_tip"
          fi
          git push origin HEAD:refs/heads/feat/den-3959-independent-polyglot-generators
