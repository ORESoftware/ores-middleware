name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-middleware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install Go 1.24.7
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.7"
          cache: false

      - name: Install Rust 1.95.0 and rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install exact contract validators
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          npm install --prefix "$RUNNER_TEMP/typespec" \
            --ignore-scripts --no-audit --no-fund \
            @typespec/compiler@1.15.0

      - name: Run peer-authority and cross-language audit
        shell: bash
        env:
          TSP_BIN: ${{ runner.temp }}/typespec/node_modules/.bin/tsp
        run: |
          set -euo pipefail
          python scripts/audit.py --receipt target/audit/receipt.json

      - name: Upload execution receipt even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-middleware-audit-${{ github.run_id }}
          path: |
            target/audit/receipt.json
            target/discrepancies/*.json
          if-no-files-found: error
          retention-days: 90
