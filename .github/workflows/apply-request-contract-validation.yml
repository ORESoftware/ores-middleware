name: Apply request-contract validation boundary

on:
  push:
    branches:
      - feat/request-contract-validation-2026-09-03

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/request-contract-validation-2026-09-03
          fetch-depth: 0

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: src/ts/package-lock.json

      - name: Apply validation-only middleware port
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/_apply_request_contract_validation.py
          python3 scripts/_apply_request_contract_validation.py
          npm ci --prefix src/ts
          npm --prefix src/ts test

      - name: Assert the resolver cannot receive validation inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'resolve(method: string, pathname: string)' src/ts/src/request-contract.ts
          ! grep -E 'resolve\([^)]*(query|header|body|request)' src/ts/src/request-contract.ts
          grep -F 'request: request.clone()' src/ts/src/request-contract.ts
          grep -F 'requestContractValidator' src/ts/src/index.ts

      - name: Commit validated product changes and remove one-use tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_apply_request_contract_validation.py
          rm -f .github/workflows/apply-request-contract-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(ts): validate typed request contracts before auth'
          git push origin HEAD:feat/request-contract-validation-2026-09-03
