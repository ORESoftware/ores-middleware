name: rustfmt host ABI once

on:
  push:
    branches:
      - feat/portable-middleware-host-abi-20260921
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustfmt-host-abi-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/portable-middleware-host-abi-20260921
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format only portable host ABI files
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            src/rust/src/host_abi.rs \
            src/rust/src/hosts/local.rs \
            src/rust/tests/host_abi_contract.rs

      - name: Commit mechanical formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            src/rust/src/host_abi.rs \
            src/rust/src/hosts/local.rs \
            src/rust/tests/host_abi_contract.rs; then
            echo 'Portable host ABI files already match pinned rustfmt.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/rust/src/host_abi.rs \
            src/rust/src/hosts/local.rs \
            src/rust/tests/host_abi_contract.rs
          git commit -m 'style(rust): apply pinned rustfmt to host ABI'
          git push origin HEAD:feat/portable-middleware-host-abi-20260921
