name: rust-transport-admission

on:
  pull_request:
    paths:
      - src/rust/**
      - Cargo.toml
      - Cargo.lock
      - contracts/function-bodies/**
      - scripts/lib/function-body-contracts.mjs
      - tests/rust-operation-binding.test.mjs
      - .github/workflows/rust-transport-admission.yml
  push:
    branches: [main, dev]
    paths:
      - src/rust/**
      - Cargo.toml
      - Cargo.lock
      - contracts/function-bodies/**
      - scripts/lib/function-body-contracts.mjs
      - tests/rust-operation-binding.test.mjs
      - .github/workflows/rust-transport-admission.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-transport-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Retain reviewed Rust source and identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p target/transport-evidence
          # This selected source snapshot is inspection evidence, not a full
          # dependency cache or standalone copy of every workspace fixture.
          git archive --format=tar.gz --output=target/transport-evidence/source.tar.gz HEAD Cargo.toml Cargo.lock src/rust contracts/function-bodies tests/rust-operation-binding.test.mjs
          printf '%s\n' "$EXPECTED_SHA" > target/transport-evidence/source-commit.txt
          sha256sum target/transport-evidence/source.tar.gz > target/transport-evidence/source.sha256
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Check actual source bindings and negative ordering mutations
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee target/transport-evidence/node-version.txt
          node --test tests/rust-operation-binding.test.mjs 2>&1 | tee target/transport-evidence/source-binding.log
      - name: Check formatting of the new transport regression suites
        shell: bash
        run: |
          set -euo pipefail
          for file in src/rust/tests/operation_admission.rs src/rust/tests/operation_controlled.rs src/rust/tests/tcp_lifecycle.rs; do
            mkdir -p "target/transport-evidence/formatted/$(dirname "$file")"
            rustfmt --edition 2024 --emit stdout < "$file" > "target/transport-evidence/formatted/$file"
            cmp "$file" "target/transport-evidence/formatted/$file"
          done
      - name: Run actual Rust operation and transport tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | tee target/transport-evidence/toolchain.txt
          cargo test --locked --manifest-path src/rust/Cargo.toml --all-features 2>&1 | tee target/transport-evidence/all-features.log
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features 2>&1 | tee target/transport-evidence/portable-core.log
          git diff --exit-code -- Cargo.toml Cargo.lock src/rust contracts/function-bodies
          printf 'passed\n' > target/transport-evidence/result.txt
      - name: Retain source and real execution logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-transport-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/transport-evidence/
          if-no-files-found: error
          retention-days: 14
