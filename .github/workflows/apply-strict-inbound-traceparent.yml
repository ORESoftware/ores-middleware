name: Apply strict inbound traceparent validation

on:
  push:
    branches: [fix/valid-response-traceparent-2026-09-03]
    paths:
      - scripts/apply_strict_inbound_traceparent.rs
      - .github/workflows/apply-strict-inbound-traceparent.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-strict-inbound-traceparent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install Go 1.25.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install pinned BEAM toolchains
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          elixir-version: "1.18.4"
          gleam-version: "1.18.1"
          rebar3-version: "3.24.0"

      - name: Apply exact semantic edits
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 scripts/apply_strict_inbound_traceparent.rs -o "${RUNNER_TEMP}/apply-strict-inbound-traceparent"
          "${RUNNER_TEMP}/apply-strict-inbound-traceparent"

      - name: Format touched native sources
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w src/golang/middleware.go src/golang/traceparent_policy_test.go
          rustfmt --edition 2024 src/rust/src/pipeline.rs scripts/check_traceparent_policy.rs
          (cd src/gleam && gleam format src test)
          git diff --check

      - name: Test TypeScript and Node adapters
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/ts --no-audit --no-fund
          npm --prefix src/ts test

      - name: Test Go with race detector
        shell: bash
        run: |
          set -euo pipefail
          (cd src/golang && go test -race -shuffle=on -count=2 ./...)

      - name: Test Rust and the permanent source audit
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src/rust/Cargo.toml --all-features
          rustc --edition=2024 scripts/check_traceparent_policy.rs -o "${RUNNER_TEMP}/check-traceparent-policy"
          "${RUNNER_TEMP}/check-traceparent-policy"

      - name: Test Gleam, Elixir, and Erlang
        shell: bash
        run: |
          set -euo pipefail
          (cd src/gleam && gleam format --check src test && gleam test)
          (cd src/elixir && mix local.hex --force && mix deps.get && mix test)
          (cd src/erlang && rebar3 eunit)

      - name: Commit only validated production and test changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ORESoftware trace-context repair"
          git config user.email "alex@oresoftware.com"
          git add -- \
            docs/RESPONSE_TRACE_CONTEXT.md \
            scripts/check_traceparent_policy.rs \
            src/ts/src/index.ts \
            src/ts/test/traceparent-policy.test.mjs \
            src/golang/middleware.go \
            src/golang/traceparent_policy_test.go \
            src/rust/src/pipeline.rs \
            src/gleam/src/ores_middleware.gleam \
            src/gleam/test/traceparent_policy_test.gleam \
            src/elixir/lib/ores_middleware/plug.ex \
            src/elixir/test/traceparent_policy_test.exs \
            src/erlang/src/ores_middleware.erl \
            src/erlang/test/ores_middleware_traceparent_tests.erl
          if git diff --cached --quiet; then
            echo "No strict inbound validation changes were produced" >&2
            exit 1
          fi
          git commit -m "fix: reject incomplete inbound trace context"
          git push origin "HEAD:${GITHUB_REF_NAME}"
