name: one-shot adversarial Rust contract parity

on:
  push:
    branches:
      - test/rust-contract-parity-adversarial-2026-09-03

permissions:
  contents: write

concurrency:
  group: one-shot-rust-contract-parity-adversarial
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/rust-contract-parity-adversarial-2026-09-03
          fetch-depth: 0

      - name: add fail-closed duplicate and malformed-required checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/contract-parity/src/lib.rs")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              '''    let mut values = Vec::new();
              for raw in body.lines() {
          ''',
              '''    let mut values = Vec::new();
              let mut seen = BTreeSet::new();
              for raw in body.lines() {
          ''',
              "enum seen set",
          )
          replace_once(
              '''        values.push(captures[1].to_owned());
              }
              Ok(values)
          ''',
              '''        let value = captures[1].to_owned();
                  if !seen.insert(value.clone()) {
                      return Err(format!("duplicate TypeSpec enum value in {name}: {value}").into());
                  }
                  values.push(value);
              }
              Ok(values)
          ''',
              "enum duplicate rejection",
          )
          replace_once(
              '''        properties.insert(
                      property_name,
                      json!({
          ''',
              '''        if properties.contains_key(&property_name) {
                      return Err(
                          format!("duplicate TypeSpec property in model {name}: {property_name}")
                              .into(),
                      );
                  }
                  properties.insert(
                      property_name,
                      json!({
          ''',
              "model duplicate rejection",
          )

          old_required = '''    let required: BTreeSet<&str> = definition
                  .get("required")
                  .and_then(Value::as_array)
                  .into_iter()
                  .flatten()
                  .filter_map(Value::as_str)
                  .collect();
              let source_properties = definition
                  .get("properties")
                  .and_then(Value::as_object)
                  .ok_or_else(|| format!("missing properties for JSON Schema definition {name}"))?;
          '''
          new_required = '''    let source_properties = definition
                  .get("properties")
                  .and_then(Value::as_object)
                  .ok_or_else(|| format!("missing properties for JSON Schema definition {name}"))?;
              let required_values = definition
                  .get("required")
                  .and_then(Value::as_array)
                  .ok_or_else(|| format!("missing required array for JSON Schema definition {name}"))?;
              let mut required = BTreeSet::new();
              for item in required_values {
                  let property = item.as_str().ok_or_else(|| {
                      format!("non-string required property in JSON Schema definition {name}")
                  })?;
                  if !required.insert(property) {
                      return Err(format!(
                          "duplicate required property in JSON Schema definition {name}: {property}"
                      )
                      .into());
                  }
                  if !source_properties.contains_key(property) {
                      return Err(format!(
                          "unknown required property in JSON Schema definition {name}: {property}"
                      )
                      .into());
                  }
              }
          '''
          replace_once(old_required, new_required, "JSON required validation")

          insertion = '''    #[test]
              fn hierarchy_regression_stops_evaluation() {
          '''
          tests = '''    #[test]
              fn duplicate_typespec_property_is_rejected() {
                  let temp = fixture_root();
                  let path = temp.path().join("contracts/docs-serving.tsp");
                  let source = fs::read_to_string(&path).unwrap();
                  let duplicate = source.replace(
                      "  accept?: string;",
                      "  accept?: string;\\n  accept?: string;",
                  );
                  fs::write(&path, duplicate).unwrap();
                  let error = run(temp.path()).expect_err("duplicate property must fail closed");
                  assert!(error.to_string().contains("duplicate TypeSpec property"));
              }

              #[test]
              fn duplicate_typespec_enum_value_is_rejected() {
                  let temp = fixture_root();
                  let path = temp.path().join("contracts/docs-serving.tsp");
                  let source = fs::read_to_string(&path).unwrap();
                  let duplicate = source.replace(
                      "  Html: \\"html\\",",
                      "  Html: \\"html\\",\\n  HtmlAgain: \\"html\\",",
                  );
                  fs::write(&path, duplicate).unwrap();
                  let error = run(temp.path()).expect_err("duplicate enum value must fail closed");
                  assert!(error.to_string().contains("duplicate TypeSpec enum value"));
              }

              #[test]
              fn malformed_json_required_entries_are_rejected() {
                  for mutation in ["unknown", "duplicate", "non-string"] {
                      let temp = fixture_root();
                      let path = temp.path().join("contracts/docs-serving.schema.json");
                      let mut schema: Value =
                          serde_json::from_slice(&fs::read(&path).unwrap()).unwrap();
                      let required = schema["$defs"]["DocsRequest"]["required"]
                          .as_array_mut()
                          .unwrap();
                      match mutation {
                          "unknown" => required.push(Value::String("notAProperty".to_owned())),
                          "duplicate" => required.push(required[0].clone()),
                          "non-string" => required.push(json!(42)),
                          _ => unreachable!(),
                      }
                      fs::write(&path, serde_json::to_vec_pretty(&schema).unwrap()).unwrap();
                      assert!(
                          run(temp.path()).is_err(),
                          "{mutation} required entry must fail closed"
                      );
                  }
              }

              #[test]
              fn repeated_discrepancy_runs_are_byte_stable() {
                  let temp = fixture_root();
                  let path = temp.path().join("contracts/authority-topology.json");
                  let mut topology: Value =
                      serde_json::from_slice(&fs::read(&path).unwrap()).unwrap();
                  topology["prohibitedAuthorityEdges"] = json!([]);
                  fs::write(&path, serde_json::to_vec_pretty(&topology).unwrap()).unwrap();

                  let first = run(temp.path()).expect("first run");
                  let second = run(temp.path()).expect("second run");
                  assert_eq!(
                      serde_json::to_vec(&first).unwrap(),
                      serde_json::to_vec(&second).unwrap()
                  );
              }

          '''
          if source.count(insertion) != 1:
              raise SystemExit("test insertion point drifted")
          source = source.replace(insertion, tests + insertion, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: format, lint, test, and exercise live command
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml --all
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/contract-parity/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/contract-parity/Cargo.toml --locked
          cargo run --quiet --manifest-path tools/contract-parity/Cargo.toml -- \
            --root . --report target/audit/adversarial-contract-parity.json
          test "$(jq -r .status target/audit/adversarial-contract-parity.json)" = passed
          git diff --check

      - name: commit tested source and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/contract-parity-adversarial-one-shot.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/contract-parity/src/lib.rs \
            .github/workflows/contract-parity-adversarial-one-shot.yml
          git commit -m "test: reject ambiguous peer-authority declarations"
          git push origin HEAD:test/rust-contract-parity-adversarial-2026-09-03
