name: release-zed

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - '.github/workflows/release-zed.yml'
      - '.github/workflows/zed-source-tag.yml'
      - 'scripts/run-zed-release-acceptance.sh'
      - 'scripts/installed_package_smoke.py'
      - 'scripts/build_targets.py'
      - 'src/**'
      - 'contracts/**'
  push:
    branches: [main]
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - '.github/workflows/release-zed.yml'
      - '.github/workflows/zed-source-tag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-zed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact Zed release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install checksum-verified Zed 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          readonly url='https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz'
          readonly expected='f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a'
          mkdir -p "$RUNNER_TEMP/zed-dist"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/zed.tar.gz" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP/zed-dist"
          zed_bin="$(find "$RUNNER_TEMP/zed-dist" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          printf 'ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"
          "$zed_bin" --version

      - name: Verify manifest and lock identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          package = manifest['package']
          assert package['org'] == 'oresoftware'
          assert package['name'] == 'ores-middleware'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', package['version'])
          assert package['repository']['url'] == 'https://github.com/ORESoftware/ores-middleware'
          assert manifest['publish']['tag_format'] == 'v{version}'
          print(f"release version={package['version']}")
          PY
          test -s .zpkg.lock
          "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
            > "$RUNNER_TEMP/zed-release-validate.json"

      - name: Verify locked direct dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          lock = tomllib.loads(Path('.zpkg.lock').read_text())
          packages = {f"{p.get('org')}/{p.get('name')}": p for p in lock.get('packages', [])}
          required = set(manifest.get('dependencies', {}))
          missing = sorted(required - set(packages))
          if missing:
              raise SystemExit(f'missing locked direct dependencies: {missing}')
          for name in sorted(required):
              item = packages[name]
              assert item.get('version'), name
              assert re.fullmatch(r'[0-9a-f]{64}', item.get('sha256', '')), name
              assert isinstance(item.get('size'), int) and item['size'] > 0, name
              assert item.get('format'), name
              assert item.get('source'), name
              assert item.get('vcs_tag'), name
              assert re.fullmatch(r'[0-9a-f]{40}', item.get('vcs_commit', '')), name
          print(f'verified {len(required)} locked direct dependencies')
          PY

      - name: Plan and preflight release without credentials
        shell: bash
        run: |
          set -euo pipefail
          "$ZED_BIN" release plan --json > "$RUNNER_TEMP/zed-release-plan.json"
          "$ZED_BIN" release preflight
          test -s "$RUNNER_TEMP/zed-release-plan.json"

      - name: Pack twice and verify deterministic release artifacts
        shell: bash
        env:
          ZED_ACCEPTANCE_RECEIPT_DIR: ${{ runner.temp }}/zed-acceptance
          ZED_ACCEPTANCE_SOURCE_COMMIT: ${{ github.sha }}
        run: bash scripts/run-zed-release-acceptance.sh

      - name: Upload verification receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-release-verify-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zed-release-validate.json
            ${{ runner.temp }}/zed-release-plan.json
            ${{ runner.temp }}/zed-acceptance/receipt.json
            ${{ runner.temp }}/zed-acceptance/acceptance-scope.json
            ${{ runner.temp }}/zed-acceptance/package-first-digests.txt
          if-no-files-found: error
          retention-days: 90

  tag:
    name: Create immutable package tag
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve package version
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('.zpkg.toml').read_text())['package']['version'])
          PY
          )"
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create or verify tag at this exact reviewed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          tag = f"v{os.environ['EXPECTED_VERSION']}"
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          base = os.environ['GITHUB_API_URL']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ores-middleware-zed-release',
          }
          ref_url = f'{base}/repos/{repository}/git/ref/tags/{tag}'
          try:
              with urllib.request.urlopen(urllib.request.Request(ref_url, headers=headers), timeout=30) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              body = json.dumps({'ref': f'refs/tags/{tag}', 'sha': sha}).encode()
              request = urllib.request.Request(
                  f'{base}/repos/{repository}/git/refs',
                  data=body,
                  headers={**headers, 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  created = json.load(response)
              if created['object']['sha'] != sha:
                  raise SystemExit(f'{tag} creation returned wrong commit')
              print(f'created {tag} at {sha}')
          else:
              if existing['object']['sha'] != sha:
                  raise SystemExit(
                      f"{tag} already points to {existing['object']['sha']}; refusing immutable tag rewrite"
                  )
              print(f'{tag} already points to {sha}')
          PY

  publish:
    name: Publish and consume exact Zed release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: zed-pkg
    permissions:
      contents: read
    steps:
      - name: Check out exact tagged source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Zed 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          readonly url='https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz'
          readonly expected='f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a'
          mkdir -p "$RUNNER_TEMP/zed-dist"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/zed.tar.gz" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP/zed-dist"
          zed_bin="$(find "$RUNNER_TEMP/zed-dist" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          printf 'ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"

      - name: Verify immutable tag before publication
        env:
          EXPECTED_TAG: ${{ needs.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_TAG"
          git fetch --force origin "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          test "$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Publish reviewed package
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZED_PKG_TOKEN"
          "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
            > "$RUNNER_TEMP/zed-publish-validate.json"
          "$ZED_BIN" release plan
          "$ZED_BIN" release preflight
          "$ZED_BIN" pack --out "$RUNNER_TEMP/zed-publish-pack"
          "$ZED_BIN" publish

      - name: Verify registry dependency closure from clean consumer
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
          RELEASE_VERSION: ${{ needs.tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZED_PKG_TOKEN"
          test -n "$RELEASE_VERSION"
          consumer="$RUNNER_TEMP/zed-clean-consumer"
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          "$ZED_BIN" install "oresoftware/ores-middleware@$RELEASE_VERSION" --install-mode copy
          "$ZED_BIN" inspect --root "$consumer" --format json > "$RUNNER_TEMP/zed-consumer-inspect.json"
          test -s "$RUNNER_TEMP/zed-consumer-inspect.json"
          "$ZED_BIN" install --frozen --install-mode copy
          smoke="$(find "$consumer" -type f -path '*/target/package/scripts/installed_package_smoke.py' -print -quit)"
          test -n "$smoke"
          package_root="$(dirname "$(dirname "$(dirname "$(dirname "$smoke")")")")"
          python3 "$smoke" --root "$package_root"

      - name: Upload publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-release-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zed-publish-validate.json
            ${{ runner.temp }}/zed-publish-pack/*.tar.gz
            ${{ runner.temp }}/zed-consumer-inspect.json
            ${{ runner.temp }}/zed-clean-consumer/.zpkg.lock
          if-no-files-found: warn
          retention-days: 90
