name: Formal model

on:
  pull_request:
    paths:
      - 'conformance/formal_model.rs'
      - '.github/workflows/formal-model.yml'
      - 'src/**'
      - 'packages/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formal-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Exhaust middleware authority state space
        run: |
          rustc --edition=2021 -D warnings conformance/formal_model.rs -o /tmp/formal-model
          /tmp/formal-model
