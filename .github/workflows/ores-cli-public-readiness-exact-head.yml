name: Ores CLI public-readiness exact-head probe

on:
  push:
    branches:
      - DEN-3828-ores-cli-public-readiness-exact-head-probe
  pull_request:
    paths:
      - .github/workflows/ores-cli-public-readiness-exact-head.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-public-readiness-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_CLI_SHA: 5f495c8c790eaf17a5de0835cdbf3e2d64874617
  PUBLIC_READINESS_BLOB: 0e84711d8dec23a6a0b137255b7aa5bf0df7d2cb
  CANONICAL_TEST_SHA: e914cd185c23865438083b8dfafebed8384f7aeb
  OTEL_TEST_SHA: 4507ebe7b96cd28aa6c7d9b60d272adcf37ecbca

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Require private-source read credential
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN" || {
            echo 'FLEET_GITHUB_READ_TOKEN is unavailable to this repository' >&2
            exit 1
          }

      - name: Check out exact ores-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: ${{ env.ORES_CLI_SHA }}
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: ores-cli

      - name: Verify immutable candidate and test-org pins
        working-directory: ores-cli
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ORES_CLI_SHA"
          test "$(git hash-object src/audit/public_readiness_claims.rs)" = "$PUBLIC_READINESS_BLOB"
          grep -F "CANONICAL_SHA=$CANONICAL_TEST_SHA" tests/public_readiness_test_org_canary.sh
          grep -F "OTEL_SHA=$OTEL_TEST_SHA" tests/public_readiness_test_org_canary.sh
          git diff --check
          status=0
          git grep -n -I -E '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- . ':(exclude)Cargo.lock' || status=$?
          test "$status" -eq 1

      - name: Verify shell canary syntax
        working-directory: ores-cli
        run: |
          set -euo pipefail
          bash -n tests/public_readiness_test_org_canary.sh
          bash -n post-install.sh

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Verify committed dependency graph
        working-directory: ores-cli
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check formatting
        working-directory: ores-cli
        run: cargo fmt --all --check

      - name: Compile all targets
        working-directory: ores-cli
        run: cargo check --all-targets --all-features --locked

      - name: Run focused public-readiness regressions
        working-directory: ores-cli
        run: 'cargo test --locked public_readiness_claims::tests::'

      - name: Run all Rust tests
        working-directory: ores-cli
        run: cargo test --all-targets --all-features --locked

      - name: Reject Clippy warnings
        working-directory: ores-cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run exact-SHA test-org canaries
        working-directory: ores-cli
        run: bash tests/public_readiness_test_org_canary.sh

      - name: Run ores-cli repository self-audit
        working-directory: ores-cli
        run: cargo run --quiet --locked -- audit repo --path . --profile rust-cli

      - name: Run ores-cli package self-audit
        working-directory: ores-cli
        run: cargo run --quiet --locked -- audit package --path .

      - name: Prove validation left source clean
        if: ${{ always() }}
        working-directory: ores-cli
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          test -z "$(git status --porcelain)"
