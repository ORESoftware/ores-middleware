name: apply-ts-http-lifecycle-boundary

on:
  push:
    branches:
      - agent/ts-http-lifecycle-boundary-20260903

permissions:
  contents: write

concurrency:
  group: apply-ts-http-lifecycle-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/ts-http-lifecycle-boundary-20260903
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Align guarded matches to current source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".agent-patches/apply_ts_lifecycle.py")
          text = path.read_text(encoding="utf-8")
          substitutions = [
              (
                  r'''      response = await runWithContext(context, () =>\n        withDeadline(config.settings.timeoutMs, () => next(request))\n      );''',
                  r'''      response = await runWithContext(context, () => withDeadline(config.settings.timeoutMs, () => next(request)));''',
              ),
              (
                  r'''      response = error instanceof DeadlineError\n        ? problem(504, "deadline_exceeded", "request deadline exceeded")\n        : problem(500, "internal_error", "request handler failed");''',
                  r'''      response = error instanceof DeadlineError ? problem(504, "deadline_exceeded", "request deadline exceeded") : problem(500, "internal_error", "request handler failed");''',
              ),
          ]
          for old, new in substitutions:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one stale layout fragment: {old[:80]!r}")
              text = text.replace(old, new, 1)

          old_condition = r'''    if (idempotencyKey && response.status >= 200 && response.status < 300) {'''
          if text.count(old_condition) != 2:
              raise SystemExit("expected old and new idempotency conditions in patch script")
          text = text.replace(old_condition, r'''    if (idempotencyKey) {''', 1)

          old_store = r'''      await idempotencyStore.set(idempotencyKey,'''
          new_store = r'''      await idempotencyStore.set(`${request.method}:${url.pathname}:${idempotencyKey}`,'''
          if text.count(old_store) != 2:
              raise SystemExit("expected old and new idempotency store keys in patch script")
          text = text.replace(old_store, new_store)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply exact source transformations
        run: python3 .agent-patches/apply_ts_lifecycle.py

      - name: Install and test TypeScript package
        run: |
          set -euo pipefail
          npm ci --prefix src/ts
          npm test --prefix src/ts

      - name: Commit verified source-only result
        run: |
          set -euo pipefail
          rm -f .agent-patches/apply_ts_lifecycle.py
          rmdir .agent-patches 2>/dev/null || true
          rm -f .github/workflows/apply-ts-http-lifecycle-boundary.yml
          git diff --check
          git config user.name "ores-gh-bot"
          git config user.email "ores-gh-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(ts): scope the full HTTP middleware lifecycle"
          git push origin HEAD:agent/ts-http-lifecycle-boundary-20260903
