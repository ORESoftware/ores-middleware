name: one-shot-http-response-finalization-v2

on:
  push:
    branches:
      - fix/http-response-finalization-2026-09-03
    paths:
      - .github/workflows/one-shot-http-response-finalization-v2.yml

permissions:
  contents: write

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: src/ts/package-lock.json

      - name: Apply the total response finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ts/src/index.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              """    response = await attachEtag(request, response);
              response = attachHeaders(config, context, response);
              response = maybeCompress(config, request, response);
              const durationMs = Math.max(0, now() - started);""".replace("              ", "    "),
              """    response = await attachEtag(request, response);
              response = maybeCompress(config, request, response);
              // Observers and idempotency storage receive the semantic response before
              // request-specific correlation/security headers are added. The one outer
              // finalizer applies those headers exactly once to every response path.
              const durationMs = Math.max(0, now() - started);""".replace("              ", "    "),
              "normal response finalization",
          )
          replace_once(
              ": operationFailureResponse(config, context, authenticatedOutcome.failure);",
              ": operationFailureResponse(authenticatedOutcome.failure);",
              "authenticated operation failure",
          )
          replace_once(
              """    return preAuthOutcome.ok
              ? preAuthOutcome.value
              : operationFailureResponse(config, context, preAuthOutcome.failure);""",
              """    const response = preAuthOutcome.ok
              ? preAuthOutcome.value
              : operationFailureResponse(preAuthOutcome.failure);
              return attachHeaders(config, context, response);""",
              "outer response finalization",
          )
          replace_once(
              """function operationFailureResponse(
              config: MiddlewareConfig,
              context: RequestContext,
              failure: OperationFailure
              ): Response {
              const response = failure.kind === \"deadline_exceeded\"
              ? problem(504, \"deadline_exceeded\", \"request deadline exceeded\")
              : failure.kind === \"cancelled\"
              ? problem(499, \"request_cancelled\", \"request was cancelled\")
              : problem(500, \"internal_error\", \"request processing failed\");
              return attachHeaders(config, context, response);
              }""".replace("              ", "  "),
              """function operationFailureResponse(failure: OperationFailure): Response {
              return failure.kind === \"deadline_exceeded\"
              ? problem(504, \"deadline_exceeded\", \"request deadline exceeded\")
              : failure.kind === \"cancelled\"
              ? problem(499, \"request_cancelled\", \"request was cancelled\")
              : problem(500, \"internal_error\", \"request processing failed\");
              }""".replace("              ", "  "),
              "operation failure response",
          )
          replace_once(
              '  headers.append("vary", "accept, accept-encoding");',
              '  mergeVary(headers, "accept", "accept-encoding");',
              "base Vary finalization",
          )
          replace_once(
              'headers.append("vary", "accept-encoding");',
              'mergeVary(headers, "accept-encoding");',
              "compression Vary finalization",
          )

          anchor = "function attachHeaders(config: MiddlewareConfig, context: RequestContext, response: Response): Response {"
          helper = """function mergeVary(headers: Headers, ...tokens: string[]): void {
            const existing = headers.get(\"vary\");
            if (existing?.trim() === \"*\") return;
            const values = new Set<string>();
            for (const value of [...(existing?.split(\",\") ?? []), ...tokens]) {
              const token = value.trim().toLowerCase();
              if (token) values.add(token);
            }
            if (values.size > 0) headers.set(\"vary\", [...values].join(\", \"));
            else headers.delete(\"vary\");
          }
          """.replace("          ", "")
          replace_once(anchor, helper + "\n" + anchor, "attachHeaders anchor")
          path.write_text(source, encoding="utf-8")
          PY

      - name: Run the complete TypeScript package suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund
          npm test --prefix src/ts

      - name: Commit verified source and remove one-shot workflows
        shell: bash
        env:
          BRANCH: fix/http-response-finalization-2026-09-03
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-http-response-finalization.yml
          rm .github/workflows/one-shot-http-response-finalization-v2.yml
          git diff --check
          git add -- \
            src/ts/src/index.ts \
            src/ts/test/http-rejection-finalization.test.mjs \
            .github/workflows/one-shot-http-response-finalization.yml \
            .github/workflows/one-shot-http-response-finalization-v2.yml
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git commit -m "fix(ts): finalize every HTTP response exactly once"
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "::error::branch advanced from $GITHUB_SHA to $remote_head; refusing to overwrite concurrent work"
            exit 3
          fi
          git push origin "HEAD:$BRANCH"
