name: one-shot-http-response-finalization

on:
  push:
    branches:
      - fix/http-response-finalization-2026-09-03
    paths:
      - .github/workflows/one-shot-http-response-finalization.yml

permissions:
  contents: write

jobs:
  apply-test-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: src/ts/package-lock.json

      - name: Apply the total response finalizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/ts/src/index.ts")
          source = path.read_text(encoding="utf-8")

          def substitute(pattern: str, replacement: str, label: str, *, flags: int = 0) -> None:
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")

          substitute(
              r"    response = await attachEtag\(request, response\);\n    response = attachHeaders\(config, context, response\);\n    response = maybeCompress\(config, request, response\);\n    const durationMs = Math\.max\(0, now\(\) - started\);",
              "    response = await attachEtag(request, response);\n"
              "    response = maybeCompress(config, request, response);\n"
              "    // Observers and idempotency storage receive the semantic response before\n"
              "    // request-specific correlation/security headers are added. The one outer\n"
              "    // finalizer applies those headers exactly once to every response path.\n"
              "    const durationMs = Math.max(0, now() - started);",
              "normal response finalization",
          )
          substitute(
              r": operationFailureResponse\(config, context, authenticatedOutcome\.failure\);",
              ": operationFailureResponse(authenticatedOutcome.failure);",
              "authenticated operation failure",
          )
          substitute(
              r"(?m)^    return preAuthOutcome\.ok\n\s+\? preAuthOutcome\.value\n\s+: operationFailureResponse\(config, context, preAuthOutcome\.failure\);$",
              "    const response = preAuthOutcome.ok\n"
              "      ? preAuthOutcome.value\n"
              "      : operationFailureResponse(preAuthOutcome.failure);\n"
              "    return attachHeaders(config, context, response);",
              "outer response finalization",
          )
          substitute(
              r"function operationFailureResponse\([\s\S]*?\n}\n\nfunction problem",
              "function operationFailureResponse(failure: OperationFailure): Response {\n"
              "  return failure.kind === \"deadline_exceeded\"\n"
              "    ? problem(504, \"deadline_exceeded\", \"request deadline exceeded\")\n"
              "    : failure.kind === \"cancelled\"\n"
              "      ? problem(499, \"request_cancelled\", \"request was cancelled\")\n"
              "      : problem(500, \"internal_error\", \"request processing failed\");\n"
              "}\n\nfunction problem",
              "operation failure response",
          )
          substitute(
              r'  headers\.append\("vary", "accept, accept-encoding"\);',
              '  mergeVary(headers, "accept", "accept-encoding");',
              "base Vary finalization",
          )
          substitute(
              r'headers\.append\("vary", "accept-encoding"\);',
              'mergeVary(headers, "accept-encoding");',
              "compression Vary finalization",
          )

          anchor = "function attachHeaders(config: MiddlewareConfig, context: RequestContext, response: Response): Response {"
          helper = """function mergeVary(headers: Headers, ...tokens: string[]): void {
            const existing = headers.get("vary");
            if (existing?.trim() === "*") return;
            const values = new Set<string>();
            for (const value of [...(existing?.split(",") ?? []), ...tokens]) {
              const token = value.trim().toLowerCase();
              if (token) values.add(token);
            }
            if (values.size > 0) headers.set("vary", [...values].join(", "));
            else headers.delete("vary");
          }
          """.replace("          ", "")
          if source.count(anchor) != 1:
              raise SystemExit("attachHeaders anchor drifted")
          source = source.replace(anchor, helper + "\n" + anchor, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Run the complete TypeScript package suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund
          npm test --prefix src/ts

      - name: Commit verified source and remove one-shot workflows
        shell: bash
        env:
          BRANCH: fix/http-response-finalization-2026-09-03
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-http-response-finalization.yml
          rm .github/workflows/one-shot-http-response-finalization-v2.yml
          git diff --check
          git add -- \
            src/ts/src/index.ts \
            src/ts/test/http-rejection-finalization.test.mjs \
            .github/workflows/one-shot-http-response-finalization.yml \
            .github/workflows/one-shot-http-response-finalization-v2.yml
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git commit -m "fix(ts): finalize every HTTP response exactly once"
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          if [[ "$remote_head" != "$GITHUB_SHA" ]]; then
            echo "::error::branch advanced from $GITHUB_SHA to $remote_head; refusing to overwrite concurrent work"
            exit 3
          fi
          git push origin "HEAD:$BRANCH"
