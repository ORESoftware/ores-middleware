name: ores-mw-config-tjsv

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-mw-config-tjsv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-and-peer-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact middleware source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install locked repository dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run manifest hardening and authored JSON admission
        run: npm run ores-mw:check

      - name: Compile the independent TypeSpec authority
        run: npx tsp compile contracts/ores-mw-config/typespec --no-emit

      - name: Test local TJSV receipt admission policy
        run: npm run ores-mw:tjsv:test

      - name: Check out exact upstream TJSV source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 4a5d049218adc2740d4cf78f612caf7f38f6f64c
          path: target/tools/tjsv
          persist-credentials: false
          show-progress: false

      - name: Install upstream locked compiler and dependencies
        run: npm ci --prefix target/tools/tjsv --ignore-scripts --no-audit --no-fund

      - name: Build only the locked flags-2-env native dependency
        working-directory: target/tools/tjsv
        shell: bash
        run: |
          set -euo pipefail
          npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node

      - name: Require source and differential .ores-mw contract parity
        run: npm run ores-mw:tjsv

      - name: Prove authored/config sources were not rewritten by the gates
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            .ores-mw.toml \
            contracts/ores-mw-config \
            contracts/tjsv-instances/ores-mw-config \
            fixtures/ores-mw \
            scripts/ores_mw_config.py \
            scripts/check-tjsv-ores-mw.mjs \
            scripts/validate-ores-mw-config.mjs \
            tests/test_ores_mw_config.py \
            tests/test_ores_mw_output_hardening.py \
            tests/tjsv-ores-mw-config.test.mjs \
            docs/ores-mw-config.md \
            package.json package-lock.json

      - name: Record exact checked revisions
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/tjsv
          git rev-parse HEAD > target/tjsv/source-commit.txt
          git -C target/tools/tjsv rev-parse HEAD > target/tjsv/tool-commit.txt

      - name: Retain compiled config and fresh TJSV evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ores-mw-config-tjsv-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ores-mw/**/*
            target/tjsv/ores-mw-config-*/**/*
            target/tjsv/*-commit.txt
          if-no-files-found: error
          retention-days: 90
