name: reconcile-pr24-main

on:
  push:
    branches:
      - test/rust-contract-parity-adversarial-2026-09-03

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Merge current main without choosing conflict sides automatically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin main
          if ! git merge --no-ff origin/main -m 'merge: reconcile current main into adversarial parity tests'; then
            echo 'Semantic reconciliation required for these unresolved paths:' >&2
            git diff --name-only --diff-filter=U >&2
            git merge --abort
            exit 2
          fi
          rm -- .github/workflows/reconcile-pr24-main.yml
          git add -- .github/workflows/reconcile-pr24-main.yml
          git commit -m 'chore: remove one-shot PR 24 reconciliation workflow'
          git push origin HEAD:test/rust-contract-parity-adversarial-2026-09-03
