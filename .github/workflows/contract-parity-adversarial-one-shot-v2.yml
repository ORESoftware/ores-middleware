name: one-shot adversarial Rust contract parity v2

on:
  push:
    branches:
      - test/rust-contract-parity-adversarial-2026-09-03

permissions:
  contents: write

concurrency:
  group: one-shot-rust-contract-parity-adversarial-v2
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/rust-contract-parity-adversarial-2026-09-03
          fetch-depth: 0

      - name: replay reviewed patch with the authored enum spelling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/contract-parity-adversarial-one-shot.yml")
          source = workflow.read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("reviewed patch start marker missing")
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("reviewed patch end marker missing")
          script = textwrap.dedent(source[start:end])
          script = script.replace(
              '"  Html: \\\\"html\\\\","',
              '"  html: \\\\"html\\\\","',
          ).replace(
              '"  Html: \\\\"html\\\\",\\\\n  HtmlAgain: \\\\"html\\\\","',
              '"  html: \\\\"html\\\\",\\\\n  htmlAgain: \\\\"html\\\\","',
          )
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          PY

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: format, lint, test, and exercise live command
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml --all
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/contract-parity/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/contract-parity/Cargo.toml --locked
          cargo run --quiet --manifest-path tools/contract-parity/Cargo.toml -- \
            --root . --report target/audit/adversarial-contract-parity.json
          test "$(jq -r .status target/audit/adversarial-contract-parity.json)" = passed
          git diff --check

      - name: commit tested source and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/contract-parity-adversarial-one-shot.yml
          rm .github/workflows/contract-parity-adversarial-one-shot-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/contract-parity/src/lib.rs \
            .github/workflows/contract-parity-adversarial-one-shot.yml \
            .github/workflows/contract-parity-adversarial-one-shot-v2.yml
          git commit -m "test: reject ambiguous peer-authority declarations"
          git push origin HEAD:test/rust-contract-parity-adversarial-2026-09-03
