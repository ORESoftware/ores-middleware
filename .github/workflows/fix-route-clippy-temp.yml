name: temporary route clippy fix
on:
  push:
    branches: [feat/edge-middleware-route-rate-limits]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/rust/src/rate_limit_routes.rs')
          s = p.read_text()
          old = '''        if let Some(template) = &self.path_template {\n            if let Err(code) = validate_path_template(template) {\n                violations.push(RouteRateLimitViolation {\n                    code,\n                    path: "selector.path_template".into(),\n                    message: "path_template must be an absolute normalized route template",\n                });\n            }\n        }\n'''
          new = '''        if let Some(template) = &self.path_template\n            && let Err(code) = validate_path_template(template)\n        {\n            violations.push(RouteRateLimitViolation {\n                code,\n                path: "selector.path_template".into(),\n                message: "path_template must be an absolute normalized route template",\n            });\n        }\n'''
          if old not in s:
              raise SystemExit('expected clippy target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rustfmt --edition 2024 src/rust/src/rate_limit_routes.rs
          if git diff --quiet -- src/rust/src/rate_limit_routes.rs; then
            echo "already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rust/src/rate_limit_routes.rs
          git commit -m "fix: satisfy route resolver clippy gate"
          git push origin HEAD:feat/edge-middleware-route-rate-limits
