name: Canonicalize DEN-3959 generated Erlang module once

on:
  push:
    branches:
      - feat/den-3959-independent-polyglot-generators
    paths:
      - .github/workflows/den-3959-canonical-erlang-module-once.yml

permissions:
  contents: write

concurrency:
  group: den-3959-canonical-erlang-module-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ORESoftware/ores-middleware'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27.3.4.14'
          elixir-version: '1.18.4'
          gleam-version: '1.18.1'
          rebar3-version: '3.24.0'
      - name: Align generated Erlang file and module identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          generator = Path('tools/contract-parity/src/bin/persistence_codegen.rs')
          text = generator.read_text(encoding='utf-8')
          old = '"-module(ores_middleware_generated_idempotency_record).\\n'
          new = '"-module(idempotency_record).\\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one generated Erlang module declaration, found {text.count(old)}')
          generator.write_text(text.replace(old, new, 1), encoding='utf-8')

          witness = Path('tests/generated-runtime/erlang/src/runtime_witness.erl')
          witness_text = witness.read_text(encoding='utf-8')
          old_macro = '-define(GENERATED, ores_middleware_generated_idempotency_record).'
          new_macro = '-define(GENERATED, idempotency_record).'
          if witness_text.count(old_macro) != 1:
              raise SystemExit(f'expected one Erlang witness module macro, found {witness_text.count(old_macro)}')
          witness.write_text(witness_text.replace(old_macro, new_macro, 1), encoding='utf-8')
          PY
          rustfmt --edition 2024 tools/contract-parity/src/bin/persistence_codegen.rs
      - name: Install exact workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund
      - name: Prove both authorities and all native runtime witnesses
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml -- --check
          cargo test --manifest-path tools/contract-parity/Cargo.toml --all-targets
          npm run contracts:polyglot-generate
          npm run contracts:generated-check
          for lane in typespec json-schema-openapi; do
            generated="target/schema-convergence/${lane}/erlang/idempotency_record.erl"
            grep -Fq -- '-module(idempotency_record).' "$generated"
            mkdir -p "target/generated-compile/erlang/${lane}"
            erlc -o "target/generated-compile/erlang/${lane}" "$generated"
            test -s "target/generated-compile/erlang/${lane}/idempotency_record.beam"
          done
          node scripts/generated_runtime_matrix.mjs
          jq -e '
            .schema == "ores.generated-runtime-convergence-report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            ([.witnesses[] | select(.state == "executed")] | length) == 12
          ' target/generated-runtime-convergence/receipt.json
      - name: Commit only proven source repairs and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/contract-parity/src/bin/persistence_codegen.rs \
            tests/generated-runtime/erlang/src/runtime_witness.erl
          git rm -- .github/workflows/den-3959-canonical-erlang-module-once.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(tools/contract-parity/src/bin/persistence_codegen.rs|tests/generated-runtime/erlang/src/runtime_witness.erl|\.github/workflows/den-3959-canonical-erlang-module-once\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'fix(DEN-3959): align generated Erlang file and module identity'
          git fetch origin feat/den-3959-independent-polyglot-generators
          remote_tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            git merge --no-ff --no-edit "$remote_tip"
          fi
          git push origin HEAD:refs/heads/feat/den-3959-independent-polyglot-generators
