name: graceful-shutdown-conformance

on:
  pull_request:
    paths:
      - "contracts/graceful-shutdown/**"
      - "scripts/lib/graceful-shutdown-conformance.mjs"
      - "scripts/validate-graceful-shutdown-conformance.mjs"
      - "scripts/test-graceful-shutdown-conformance-validator.mjs"
      - "src/rust/src/shutdown.rs"
      - "src/rust/src/frameworks/axum_shutdown.rs"
      - "src/ts/src/shutdown.ts"
      - "src/ts/test/shutdown.test.mjs"
      - "src/golang/shutdown.go"
      - "src/golang/shutdown_test.go"
      - ".github/workflows/graceful-shutdown-conformance.yml"
  push:
    branches: [main]
    paths:
      - "contracts/graceful-shutdown/**"
      - "scripts/lib/graceful-shutdown-conformance.mjs"
      - "scripts/validate-graceful-shutdown-conformance.mjs"
      - "scripts/test-graceful-shutdown-conformance-validator.mjs"
      - "src/rust/src/shutdown.rs"
      - "src/rust/src/frameworks/axum_shutdown.rs"
      - "src/ts/src/shutdown.ts"
      - "src/ts/test/shutdown.test.mjs"
      - "src/golang/shutdown.go"
      - "src/golang/shutdown_test.go"
      - ".github/workflows/graceful-shutdown-conformance.yml"

permissions:
  contents: read

jobs:
  portable-shutdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORES_WORKFLOW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ORES_WORKFLOW_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact source identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Validate versioned shutdown vectors
        run: node scripts/validate-graceful-shutdown-conformance.mjs

      - name: Execute 15 negative-control validator tests
        run: node --test scripts/test-graceful-shutdown-conformance-validator.mjs

      - name: Build and test TypeScript shutdown coordinator
        run: |
          npm ci --prefix src/ts --no-audit --no-fund
          npm --prefix src/ts run build
          node --test src/ts/test/shutdown.test.mjs

      - name: Install Go 1.25.0
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.0"
          cache: false

      - name: Test Go shutdown coordinator and HTTP adapter
        working-directory: src/golang
        run: go test ./... -run Shutdown -count=1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Test framework-neutral Rust shutdown core
        run: cargo test --manifest-path src/rust/Cargo.toml --no-default-features shutdown

      - name: Test Axum shutdown admission
        run: cargo test --manifest-path src/rust/Cargo.toml --all-features shutdown
