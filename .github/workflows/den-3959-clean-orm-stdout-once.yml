name: Publish proven DEN-3959 ORM stdout isolation once

on:
  push:
    branches:
      - feat/den-3959-independent-polyglot-generators
    paths:
      - .github/workflows/den-3959-clean-orm-stdout-once.yml

permissions:
  contents: write

concurrency:
  group: den-3959-clean-orm-stdout-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'ORESoftware/ores-middleware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply the PostgreSQL-proven split-stream change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/orm_matrix_gate.py')
          text = path.read_text(encoding='utf-8')
          legacy = '    run_command,\n'
          if text.count(legacy) != 1:
              raise SystemExit(f'expected one legacy run_command import, found {text.count(legacy)}')
          text = text.replace(legacy, '', 1)
          anchor = 'from scripts.schema_convergence import Model\n'
          replacement = anchor + 'from scripts.subprocess_capture import run_command\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one schema-convergence import, found {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/orm_matrix_gate.py scripts/subprocess_capture.py
          python3 -m unittest scripts/test_subprocess_capture.py scripts/test_orm_matrix_gate.py -v
      - name: Commit without rewriting concurrent branch history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/orm_matrix_gate.py
          git rm -- .github/workflows/den-3959-clean-orm-stdout-once.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(scripts/orm_matrix_gate.py|\.github/workflows/den-3959-clean-orm-stdout-once\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'fix(DEN-3959): isolate ORM witness JSON output'
          git fetch origin feat/den-3959-independent-polyglot-generators
          remote_tip="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_tip" != "$GITHUB_SHA" ]]; then
            git merge --no-ff --no-edit "$remote_tip"
          fi
          git push origin HEAD:refs/heads/feat/den-3959-independent-polyglot-generators
