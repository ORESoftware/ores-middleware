name: Repair request-contract integration against current main

on:
  push:
    branches:
      - feat/request-contract-validation-2026-09-03

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/request-contract-validation-2026-09-03
          fetch-depth: 0

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: src/ts/package-lock.json

      - name: Restore current main and apply only the validation integration
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:src/ts/src/index.ts > src/ts/src/index.ts
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ts/src/index.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one integration point, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { currentContext, runWithContext } from "./context.js";\n',
              'import { currentContext, runWithContext } from "./context.js";\n'
              'import {\n'
              '  checkRequestContract,\n'
              '  type RequestContractValidator\n'
              '} from "./request-contract.js";\n'
          )
          replace_once(
              'export { currentContext, runWithContext };\n',
              'export { currentContext, runWithContext, checkRequestContract };\n'
              'export type {\n'
              '  RequestContractBody,\n'
              '  RequestContractFailure,\n'
              '  RequestContractIssue,\n'
              '  RequestContractMatch,\n'
              '  RequestContractValidationInput,\n'
              '  RequestContractValidator\n'
              '} from "./request-contract.js";\n'
          )
          replace_once(
              '  /** Optional audited sink; defaults to the bounded ores-otel reporter. */\n'
              '  operationFailureReporter?: OperationFailureReporter;\n',
              '  /** Optional audited sink; defaults to the bounded ores-otel reporter. */\n'
              '  operationFailureReporter?: OperationFailureReporter;\n'
              '  /**\n'
              '   * Strict parsed-request contract boundary. Operation resolution receives\n'
              '   * method + pathname only; path/query/header/body data is validation-only.\n'
              '   */\n'
              '  requestContractValidator?: RequestContractValidator;\n'
          )
          replace_once(
              '    if (dependencies.authorizeIp && !(await dependencies.authorizeIp(request, context))) return problem(403, "ip_policy_denied", "request source is not permitted");\n'
              '    if (config.settings.rateLimit.enabled) {\n',
              '    if (dependencies.authorizeIp && !(await dependencies.authorizeIp(request, context))) return problem(403, "ip_policy_denied", "request source is not permitted");\n'
              '\n'
              '    const contractFailure = await checkRequestContract(\n'
              '      dependencies.requestContractValidator,\n'
              '      request,\n'
              '      url\n'
              '    );\n'
              '    if (contractFailure) {\n'
              '      const detail = contractFailure.code === "unknown_operation"\n'
              '        ? "no request contract matched the HTTP method and pathname"\n'
              '        : "request path, query, headers, or JSON payload failed contract validation";\n'
              '      return problem(contractFailure.status, contractFailure.code, detail);\n'
              '    }\n'
              '\n'
              '    if (config.settings.rateLimit.enabled) {\n'
          )

          path.write_text(text)
          PY

      - name: Verify narrow semantic diff and run complete TypeScript suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- src/ts/src/index.ts
          grep -F 'function validTraceparent' src/ts/src/index.ts
          grep -F 'export type NextHandler' src/ts/src/index.ts
          grep -F 'export function descriptor()' src/ts/src/index.ts
          grep -F 'resolve(method: string, pathname: string)' src/ts/src/request-contract.ts
          ! grep -E 'resolve\([^)]*(query|header|body|request)' src/ts/src/request-contract.ts
          npm ci --prefix src/ts
          npm --prefix src/ts test

      - name: Commit validated repair and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-request-contract-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ts): preserve current middleware while adding request validation'
          git push origin HEAD:feat/request-contract-validation-2026-09-03
