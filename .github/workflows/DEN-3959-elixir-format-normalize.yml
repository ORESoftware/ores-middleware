name: DEN-3959 one-shot Elixir normalization

on:
  push:
    branches: [DEN-3959-elixir-descriptor-lock-reproducibility]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3959-elixir-descriptor-lock-reproducibility
          persist-credentials: true
          fetch-depth: 1
      - name: Install pinned BEAM toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          elixir-version: "1.18.4"
          rebar3-version: "3.24.0"
      - name: Normalize, remove one-shot workflow, and commit
        shell: bash
        run: |
          set -euo pipefail
          cd src/elixir
          mix deps.get
          mix format lib/**/*.ex test/**/*.exs mix.exs
          cd ../..
          git diff --check
          git rm .github/workflows/DEN-3959-elixir-format-normalize.yml
          git add -- src/elixir
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-3959): normalize Elixir source with 1.18.4 formatter'
          git push origin HEAD:DEN-3959-elixir-descriptor-lock-reproducibility
