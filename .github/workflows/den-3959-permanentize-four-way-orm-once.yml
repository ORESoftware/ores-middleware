name: Permanentize DEN-3959 four-way ORM admission once

on:
  push:
    branches:
      - fix/den-3959-no-asymmetric-orm-gate
    paths:
      - .github/workflows/den-3959-permanentize-four-way-orm-once.yml

permissions:
  contents: write

concurrency:
  group: den-3959-permanentize-four-way-orm-once
  cancel-in-progress: false

jobs:
  permanentize:
    if: github.repository == 'ORESoftware/ores-middleware'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install PostgreSQL client and libpq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql-client

      - name: Apply reviewed permanent admission wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/_finalize_den3959_orm_matrix.py
          rustfmt --edition 2024 tools/contract-parity/src/lib.rs
          python3 -m py_compile \
            scripts/check_zpkg.py \
            scripts/audit.py \
            scripts/orm_catalog_gate.py \
            scripts/orm_matrix_gate.py \
            scripts/orm_data_plane_gate.py \
            scripts/test_orm_catalog_gate.py \
            scripts/test_orm_matrix_gate.py \
            scripts/test_orm_data_plane_gate.py

      - name: Run offline fail-closed tests and package policy checks
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml -- --check
          cargo test --manifest-path tools/contract-parity/Cargo.toml --all-targets
          python3 -m unittest \
            scripts/test_orm_catalog_gate.py \
            scripts/test_orm_matrix_gate.py \
            scripts/test_orm_data_plane_gate.py \
            scripts/test_subprocess_capture.py \
            -v
          python3 scripts/check_zpkg.py

      - name: Execute catalog and row-level gates through the public command
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          npm run persistence:check
          jq -e '
            .schema == "ores.orm-catalog-convergence-report/v2" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            (.ormManifests | keys | sort == [
              "json-schema-openapi-diesel",
              "json-schema-openapi-seaorm",
              "typespec-diesel",
              "typespec-seaorm"
            ])
          ' target/orm-matrix-gate/receipt.json
          jq -e '
            .schema == "ores.orm-data-plane-convergence-report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            (.witnesses | keys | sort == [
              "json-schema-openapi-diesel",
              "json-schema-openapi-seaorm",
              "typespec-diesel",
              "typespec-seaorm"
            ]) and
            ([.witnesses[].witness.rejections[] | select(. == true)] | length) == 24
          ' target/orm-data-plane-gate/receipt.json

      - name: Commit only proven permanent source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .zpkg.toml \
            docs/architecture.md \
            scripts/audit.py \
            scripts/check_zpkg.py \
            scripts/test_orm_data_plane_gate.py \
            tools/contract-parity/src/lib.rs
          git rm -- \
            .github/workflows/den-3959-permanentize-four-way-orm-once.yml \
            scripts/_finalize_den3959_orm_matrix.py
          unexpected="$(git diff --cached --name-only | grep -Ev '^(\.zpkg\.toml|docs/architecture\.md|scripts/audit\.py|scripts/check_zpkg\.py|scripts/test_orm_data_plane_gate\.py|tools/contract-parity/src/lib\.rs|\.github/workflows/den-3959-permanentize-four-way-orm-once\.yml|scripts/_finalize_den3959_orm_matrix\.py)$' || true)"
          test -z "$unexpected"
          git commit -m 'fix(DEN-3959): make both ORMs mandatory for both authorities'
          git push origin HEAD:refs/heads/fix/den-3959-no-asymmetric-orm-gate
