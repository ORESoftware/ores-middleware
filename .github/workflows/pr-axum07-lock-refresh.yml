name: PR Axum07 lock refresh

on:
  push:
    branches:
      - fix/export-axum07-adapter-20260929

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Update only the lock entries required by the branch manifest graph
        run: cargo check --manifest-path src/rust/Cargo.toml --all-features
      - name: Verify the updated graph is lock-clean
        run: cargo metadata --locked --format-version 1 --manifest-path src/rust/Cargo.toml >/dev/null
      - name: Commit the minimal lockfile delta when needed
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.lock
          if git diff --cached --quiet -- Cargo.lock; then
            echo 'Cargo.lock already matches the manifest graph.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(rust): refresh lockfile for Axum 0.7 adapter'
          git push origin HEAD:fix/export-axum07-adapter-20260929
