name: PR Axum07 lock refresh

on:
  push:
    branches:
      - fix/export-axum07-adapter-20260929

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Regenerate root lockfile from exact branch manifest graph
        run: cargo generate-lockfile
      - name: Verify Axum 0.7 compatibility graph resolves
        run: cargo metadata --locked --format-version 1 --manifest-path src/rust/Cargo.toml >/dev/null
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axum07-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
