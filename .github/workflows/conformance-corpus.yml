name: Conformance corpus

on:
  pull_request:
    paths: ['contracts/**', 'conformance/**', '.github/workflows/conformance-corpus.yml']
  push:
    branches: [main]
    paths: ['contracts/**', 'conformance/**', '.github/workflows/conformance-corpus.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify conformance admission
        run: |
          node --version
          node conformance/check.mjs
