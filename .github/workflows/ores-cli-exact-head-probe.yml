name: Ores CLI exact-head probe

on:
  push:
    branches:
      - DEN-390-ores-cli-exact-head-probe

permissions:
  contents: read

concurrency:
  group: ores-cli-exact-head-probe
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require private-source read credential
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$FLEET_TOKEN" ]]; then
            echo 'FLEET_GITHUB_READ_TOKEN is unavailable to this repository' >&2
            exit 1
          fi

      - name: Check out exact ores-cli boolean-negation consumer commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-cli
          ref: 12a1d25334f9e4aec2607bd60f89d9b068f11431
          token: ${{ secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: ores-cli

      - name: Verify immutable source identity
        working-directory: ores-cli
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = 12a1d25334f9e4aec2607bd60f89d9b068f11431
          git diff --check

      - name: Verify shell integration assets
        working-directory: ores-cli
        run: |
          set -euo pipefail
          bash -n post-install.sh
          bash -n reconcile-selected-orgs.sh
          bash -n tests/post_install.sh
          bash -n tests/reconcile_selected_orgs.sh
          bash tests/post_install.sh
          bash tests/reconcile_selected_orgs.sh

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Resolve lockfile
        working-directory: ores-cli
        run: cargo generate-lockfile

      - name: Check formatting
        working-directory: ores-cli
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: ores-cli
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run all Rust tests including both CLI negation entrypoints
        working-directory: ores-cli
        run: cargo test --all-targets --all-features --locked

      - name: Run repository self-audit
        working-directory: ores-cli
        run: cargo run --quiet --locked -- audit repo --path . --profile rust-cli

      - name: Run package self-audit
        working-directory: ores-cli
        run: cargo run --quiet --locked -- audit package --path .
