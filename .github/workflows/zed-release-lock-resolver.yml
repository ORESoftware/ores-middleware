name: zed-release-lock-resolver

on:
  push:
    branches:
      - 'release/zed-*'
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - '.github/workflows/zed-release-lock-resolver.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-release-lock-resolver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-lock:
    if: startsWith(github.ref, 'refs/heads/release/zed-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: zed-pkg
    permissions:
      contents: write
    steps:
      - name: Check out exact release branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install checksum-verified Zed 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          readonly url='https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz'
          readonly expected='f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a'
          mkdir -p "$RUNNER_TEMP/zed-dist"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/zed.tar.gz" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP/zed-dist"
          zed_bin="$(find "$RUNNER_TEMP/zed-dist" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          printf 'ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"
          "$zed_bin" --version

      - name: Reuse or resolve immutable dependency closure
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if test -s .zpkg.lock && \
             "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
               > "$RUNNER_TEMP/zed-lock-validate.json"; then
            printf '%s\n' 'existing .zpkg.lock is valid; resolver is a no-op'
            exit 0
          fi

          rm -f .zpkg.lock
          if test -z "$ZED_PKG_TOKEN"; then
            printf '%s\n' 'ZED_PKG_TOKEN is required to resolve a missing release lock' >&2
            exit 2
          fi

          attempt=1
          readonly max_attempts=3
          until "$ZED_BIN" install --install-mode copy; do
            if test "$attempt" -ge "$max_attempts"; then
              printf 'authenticated registry resolution failed after %s attempts\n' "$attempt" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            printf 'registry resolution attempt %s failed; retrying in %ss\n' "$attempt" "$delay" >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          done

          test -s .zpkg.lock
          "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
            > "$RUNNER_TEMP/zed-lock-validate.json"

      - name: Verify direct dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          lock = tomllib.loads(Path('.zpkg.lock').read_text())
          locked = {
              f"{item.get('org')}/{item.get('name')}": item
              for item in lock.get('packages', [])
          }
          required = set(manifest.get('dependencies', {}))
          missing = sorted(required - set(locked))
          if missing:
              raise SystemExit(f'direct dependencies missing from .zpkg.lock: {missing}')
          for name in sorted(required):
              item = locked[name]
              assert item.get('version'), name
              assert re.fullmatch(r'[0-9a-f]{64}', item.get('sha256', '')), name
              assert isinstance(item.get('size'), int) and item['size'] > 0, name
              assert item.get('format'), name
              assert item.get('source'), name
              assert item.get('vcs_tag'), name
              assert re.fullmatch(r'[0-9a-f]{40}', item.get('vcs_commit', '')), name
          print(f'verified {len(required)} direct dependency lock entries')
          PY

      - name: Commit only resolver-produced lock changes
        shell: bash
        run: |
          set -euo pipefail
          git add -- .zpkg.lock
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            printf '%s\n' 'resolver produced no lock delta'
            exit 0
          fi
          test "$staged" = '.zpkg.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock Zed dependency closure for middleware release'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload sanitized resolver evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-release-lock-${{ github.run_id }}
          path: |
            .zpkg.lock
            ${{ runner.temp }}/zed-lock-validate.json
          if-no-files-found: warn
          retention-days: 30
