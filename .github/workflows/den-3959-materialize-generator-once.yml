name: Materialize DEN-3959 Rust generator once

on:
  push:
    branches:
      - feat/den-3959-independent-polyglot-generators
    paths:
      - .github/workflows/den-3959-materialize-generator-once.yml

permissions:
  contents: write

concurrency:
  group: den-3959-materialize-generator-once
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'ORESoftware/ores-middleware'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Materialize the reviewed Rust generator payload
        shell: bash
        env:
          PAYLOAD_GZIP_BASE64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p tools/contract-parity/src/bin
          printf '%s' "$PAYLOAD_GZIP_BASE64" | base64 --decode | gzip --decompress > tools/contract-parity/src/bin/persistence_codegen.rs
          test -s tools/contract-parity/src/bin/persistence_codegen.rs
          grep -Fq 'STOPPED_FOR_EVALUATION' tools/contract-parity/src/bin/persistence_codegen.rs
          grep -Fq 'json-schema-openapi' tools/contract-parity/src/bin/persistence_codegen.rs
          grep -Fq 'diesel/idempotency_record.rs' tools/contract-parity/src/bin/persistence_codegen.rs
          grep -Fq 'seaorm/idempotency_record.rs' tools/contract-parity/src/bin/persistence_codegen.rs
      - name: Commit only the generator and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/contract-parity/src/bin/persistence_codegen.rs
          git rm -- .github/workflows/den-3959-materialize-generator-once.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(tools/contract-parity/src/bin/persistence_codegen.rs|\.github/workflows/den-3959-materialize-generator-once\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'feat(DEN-3959): add independent Rust polyglot generator'
          git push origin HEAD:refs/heads/feat/den-3959-independent-polyglot-generators
