name: middleware-host-abi

on:
  pull_request:
    paths:
      - contracts/middleware-host-abi/**
      - src/rust/src/host_abi.rs
      - src/rust/src/hosts/**
      - src/rust/src/lib.rs
      - src/rust/tests/host_abi_contract.rs
      - src/rust/Cargo.toml
      - src/rust/Cargo.lock
      - .github/workflows/middleware-host-abi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middleware-host-abi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-host-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git diff --check

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Classify Rust formatting
        id: rustfmt
        continue-on-error: true
        run: cargo fmt --manifest-path src/rust/Cargo.toml -- --check

      - name: Clippy portable host ABI
        run: cargo clippy --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib --test host_abi_contract -- -D warnings

      - name: Test portable host ABI internals
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib host_abi

      - name: Test public portable host ABI
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --test host_abi_contract

      - name: Test public host ABI with default adapters
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --test host_abi_contract

      - name: Validate authored JSON Schema parses
        shell: bash
        run: jq -e . contracts/middleware-host-abi/json-schema/authored.schema.json >/dev/null

      - name: Prove validation is source-immutable
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code -- contracts/middleware-host-abi src/rust .github/workflows/middleware-host-abi.yml
          test -z "$(git status --porcelain)"

      - name: Enforce formatting latch
        if: ${{ always() }}
        env:
          RUSTFMT_OUTCOME: ${{ steps.rustfmt.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUSTFMT_OUTCOME" != "success" ]; then
            echo 'Rust source is not reproducible under pinned rustfmt 1.95.0' >&2
            exit 1
          fi
