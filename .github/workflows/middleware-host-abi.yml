name: middleware-host-abi

on:
  pull_request:
    paths:
      - contracts/middleware-host-abi/**
      - src/rust/src/host_abi.rs
      - src/rust/src/hosts/**
      - src/rust/src/provider_api.rs
      - src/rust/src/lib.rs
      - src/rust/tests/host_abi_contract.rs
      - src/rust/Cargo.toml
      - src/rust/Cargo.lock
      - .github/workflows/middleware-host-abi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: middleware-host-abi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-host-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          git diff --check

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check portable host ABI formatting
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check \
            src/rust/src/host_abi.rs \
            src/rust/src/hosts/local.rs \
            src/rust/src/provider_api.rs \
            src/rust/tests/host_abi_contract.rs

      - name: Clippy portable host ABI
        run: cargo clippy --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib --test host_abi_contract -- -D warnings

      - name: Test portable host ABI internals
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib host_abi

      - name: Test portable provider callback API
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib provider_api

      - name: Test public portable host ABI
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --test host_abi_contract

      - name: Test public host ABI with default adapters
        run: cargo test --locked --manifest-path src/rust/Cargo.toml --test host_abi_contract

      - name: Install repository-standard Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install middleware TypeSpec dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check out immutable hardened TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 733bc1b6b4b45433a38625fc4dd9ddb108b60519
          path: tmp/tjsv-middleware-host-abi
          persist-credentials: false
          show-progress: false

      - name: Install locked TJSV compiler dependencies
        run: npm ci --prefix tmp/tjsv-middleware-host-abi --ignore-scripts --no-audit --no-fund

      - name: Build only the reviewed flags-2-env native dependency
        working-directory: tmp/tjsv-middleware-host-abi
        shell: bash
        run: |
          set -euo pipefail
          npm rebuild @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node

      - name: Enforce TypeSpec and authored JSON Schema peer parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/middleware-host-abi-tjsv
          node tmp/tjsv-middleware-host-abi/bin/typespec-json-schema-validator.mjs check \
            --typespec=contracts/middleware-host-abi/typespec/main.tsp \
            --schema=contracts/middleware-host-abi/json-schema \
            --mapping=contracts/middleware-host-abi/tjsv.mapping.json \
            --tsp-bin="${GITHUB_WORKSPACE}/tmp/tjsv-middleware-host-abi/node_modules/.bin/tsp" \
            --report=target/middleware-host-abi-tjsv/report.json \
            --output-dir=target/middleware-host-abi-tjsv/generated \
            --probes=true \
            --max-probes=128 \
            --seal-object-schemas=false \
            --int64-strategy=number \
            --polymorphic-models-strategy=oneOf \
            --format-assertion=true \
            --quiet=false

      - name: Prove validation is source-immutable
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C tmp/tjsv-middleware-host-abi rev-parse HEAD)" = "733bc1b6b4b45433a38625fc4dd9ddb108b60519"
          git diff --exit-code -- contracts/middleware-host-abi src/rust/src/host_abi.rs src/rust/src/hosts src/rust/src/provider_api.rs src/rust/tests/host_abi_contract.rs .github/workflows/middleware-host-abi.yml
          test -z "$(git status --porcelain)"

      - name: Retain peer-authority parity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: middleware-host-abi-tjsv-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/middleware-host-abi-tjsv/
          if-no-files-found: warn
          retention-days: 30
