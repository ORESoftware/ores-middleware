name: Repair OTel runtime lock

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'src/rust/Cargo.toml'
      - '.github/workflows/otel-web-interop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otel-lock-repair-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  GIT_TERMINAL_PROMPT: '0'

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
      - name: Generate resolver-authoritative lockfile
        run: cargo metadata --format-version 1 >/dev/null
      - name: Admit only the Cargo.lock delta
        run: |
          set -eu
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M Cargo.lock$' || true)"
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git diff -- Cargo.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.lock
          git commit -m 'fix(lock): accept Cargo-resolved OTel graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
