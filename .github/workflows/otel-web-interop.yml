name: Repair OTel source formatting

on:
  pull_request:
    paths:
      - 'src/rust/src/otel.rs'
      - 'src/rust/src/frameworks/axum.rs'
      - 'src/rust/tests/otel_runtime_config.rs'
      - 'src/rust/tests/otel_web_interop.rs'
      - '.github/workflows/otel-web-interop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otel-format-repair-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: never
  GIT_TERMINAL_PROMPT: '0'

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format only PR-owned OTel Rust files
        run: |
          rustfmt --edition 2024 \
            src/rust/src/otel.rs \
            src/rust/src/frameworks/axum.rs \
            src/rust/tests/otel_runtime_config.rs \
            src/rust/tests/otel_web_interop.rs
      - name: Admit only the expected formatting delta
        run: |
          set -eu
          allowed='^(src/rust/src/otel.rs|src/rust/src/frameworks/axum.rs|src/rust/tests/otel_runtime_config.rs|src/rust/tests/otel_web_interop.rs)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          if git diff --quiet; then
            echo 'OTel files already formatted'
            exit 0
          fi
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/rust/src/otel.rs src/rust/src/frameworks/axum.rs src/rust/tests/otel_runtime_config.rs src/rust/tests/otel_web_interop.rs
          git commit -m 'style(otel): apply rustfmt to runtime bridge'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
