name: Verify OTel runtime and web bridge

on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'src/rust/Cargo.toml'
      - 'src/rust/src/otel.rs'
      - 'src/rust/src/frameworks/axum.rs'
      - 'src/rust/tests/otel_runtime_config.rs'
      - 'src/rust/tests/otel_web_interop.rs'
      - 'docs/otel-web-interoperability.md'
      - 'docs/otel-runtime-config-acceptance.md'
      - '.github/workflows/otel-web-interop.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'src/rust/Cargo.toml'
      - 'src/rust/src/otel.rs'
      - 'src/rust/src/frameworks/axum.rs'
      - 'src/rust/tests/otel_runtime_config.rs'
      - 'src/rust/tests/otel_web_interop.rs'
      - 'docs/otel-web-interoperability.md'
      - 'docs/otel-runtime-config-acceptance.md'
      - '.github/workflows/otel-web-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: otel-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  GIT_TERMINAL_PROMPT: '0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Verify checked-in lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Check formatting
        run: cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
      - name: Test canonical OTel runtime bridge
        run: cargo test -p ores-middleware --test otel_runtime_config --all-features --locked
      - name: Test browser/server logger interoperability
        run: cargo test -p ores-middleware --test otel_web_interop --all-features --locked
      - name: Test portable core without default HTTP features
        run: cargo test -p ores-middleware --no-default-features --locked
      - name: Lint all Rust targets
        run: cargo clippy -p ores-middleware --all-targets --all-features --locked -- -D warnings
      - name: Require one canonical logger source
        run: |
          cargo tree -p ores-middleware --locked --edges normal,dev --prefix none --no-dedupe > "$RUNNER_TEMP/otel-tree.txt"
          grep '^oresoftware-next-loggers v' "$RUNNER_TEMP/otel-tree.txt" | sort -u > "$RUNNER_TEMP/logger-sources.txt"
          test "$(wc -l < "$RUNNER_TEMP/logger-sources.txt")" -eq 1
          grep -F '080cc8cd' "$RUNNER_TEMP/logger-sources.txt"
      - name: Require source checkout to remain immutable
        run: git diff --exit-code HEAD
