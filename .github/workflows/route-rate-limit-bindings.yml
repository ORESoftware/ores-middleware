name: route-rate-limit-bindings

on:
  pull_request:
    paths:
      - "contracts/route-rate-limit/**"
      - "scripts/validate-route-rate-limit-bindings.mjs"
      - "scripts/check-ts-package-exports.mjs"
      - "src/rust/src/rate_limit_bindings.rs"
      - "src/rust/src/lib.rs"
      - "src/rust/tests/rate_limit_bindings_corpus.rs"
      - "src/ts/src/rate-limit-bindings.ts"
      - "src/ts/test/rate-limit-bindings.test.mjs"
      - "src/ts/package.json"
      - "package.json"
      - ".github/workflows/route-rate-limit-bindings.yml"
  push:
    branches: [main]
    paths:
      - "contracts/route-rate-limit/**"
      - "scripts/validate-route-rate-limit-bindings.mjs"
      - "scripts/check-ts-package-exports.mjs"
      - "src/rust/src/rate_limit_bindings.rs"
      - "src/rust/src/lib.rs"
      - "src/rust/tests/rate_limit_bindings_corpus.rs"
      - "src/ts/src/rate-limit-bindings.ts"
      - "src/ts/test/rate-limit-bindings.test.mjs"
      - "src/ts/package.json"
      - "package.json"
      - ".github/workflows/route-rate-limit-bindings.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-rate-limit-bindings-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_WORKFLOW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TJSV_REVISION: d60d0d79d83e075077382623ec9e23a401ab601f

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.ORES_WORKFLOW_SOURCE_SHA }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install locked JavaScript dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund

      - name: Build and test TypeScript binding runtime
        run: |
          set -euo pipefail
          npm --prefix src/ts run build
          node --test src/ts/test/rate-limit-bindings.test.mjs
          node scripts/validate-route-rate-limit-bindings.mjs
          node scripts/check-ts-package-exports.mjs

      - name: Compile independent TypeSpec authority
        run: npx tsp compile contracts/route-rate-limit/typespec --output-dir target/route-rate-limit/typespec

      - name: Check out exact TJSV source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_REVISION }}
          path: target/tools/tjsv
          persist-credentials: false
          show-progress: false

      - name: Install locked TJSV dependencies
        run: |
          set -euo pipefail
          npm ci --prefix target/tools/tjsv --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix target/tools/tjsv @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s target/tools/tjsv/node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node

      - name: Enforce TypeSpec and authored JSON Schema parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/route-rate-limit/generated
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" \
            node target/tools/tjsv/bin/typespec-json-schema-validator.mjs check \
              --typespec=contracts/route-rate-limit/typespec/main.tsp \
              --schema=contracts/route-rate-limit/json-schema/authored.schema.json \
              --mapping=contracts/route-rate-limit/tjsv/mapping.json \
              --output-dir=target/route-rate-limit/generated \
              --bundle-id=route-rate-limit.generated.schema.json \
              --report=target/route-rate-limit/parity-report.json \
              --contract-ir=target/route-rate-limit/contract-ir.json \
              --quiet

      - name: Prove policy-id constraint drift fails closed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('contracts/route-rate-limit/json-schema/authored.schema.json', 'utf8'));
          source.$defs.PolicyId.maxLength = 161;
          fs.writeFileSync('target/route-rate-limit/drifted.schema.json', `${JSON.stringify(source, null, 2)}\n`);
          NODE
          set +e
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" \
            node target/tools/tjsv/bin/typespec-json-schema-validator.mjs validate \
              --schema=target/route-rate-limit/drifted.schema.json \
              --generated-schema=target/route-rate-limit/generated/route-rate-limit.generated.schema.json \
              --mapping=contracts/route-rate-limit/tjsv/mapping.json \
              --report=target/route-rate-limit/drift-report.json \
              --quiet
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "expected route binding authority drift to stop with exit 2, got $rc" >&2
            exit 1
          fi

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format, lint, and execute Rust binding runtime
        run: |
          set -euo pipefail
          rustfmt --edition 2024 --check src/rust/src/rate_limit_bindings.rs src/rust/tests/rate_limit_bindings_corpus.rs
          cargo clippy --manifest-path src/rust/Cargo.toml --no-default-features --lib -- -D warnings
          cargo clippy --manifest-path src/rust/Cargo.toml --no-default-features --test rate_limit_bindings_corpus -- -D warnings
          cargo test --manifest-path src/rust/Cargo.toml --no-default-features rate_limit_bindings
          cargo test --manifest-path src/rust/Cargo.toml --no-default-features --test rate_limit_bindings_corpus

      - name: Require source tree unchanged
        run: |
          git diff --check
          git diff --exit-code

      - name: Retain sanitized parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-rate-limit-bindings-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/route-rate-limit/
          if-no-files-found: warn
          retention-days: 30
