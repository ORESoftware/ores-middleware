name: tmp-gleam-format-diff

on:
  push:
    branches:
      - alexanderdmills/tmp-den-4078-gleam-format-diff

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
      - name: Emit canonical Gleam formatter diff
        shell: bash
        run: |
          set -euo pipefail
          cd src/gleam
          gleam format src test
          git diff --no-ext-diff -- src/ores_middleware/docs_serving.gleam test/docs_serving_test.gleam
          test -n "$(git diff -- src/ores_middleware/docs_serving.gleam test/docs_serving_test.gleam)"
          exit 1
