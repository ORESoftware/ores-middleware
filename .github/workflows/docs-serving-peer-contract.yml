name: docs-serving-peer-contract

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-serving-peer-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-serving-peer-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source head and historical baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Check out immutable TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 4473504c4c9d2831d825919f70c03994d8ce01d2
          path: target/tools/tjsv
          persist-credentials: false
          show-progress: false
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix target/tools/tjsv --ignore-scripts --no-audit --no-fund
      - name: Require baseline preservation, actual TJSV parity, and drift rejection
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/docs-serving-peers
          node --test tests/docs-serving-peers.test.mjs 2>&1 | tee target/docs-serving-peers/test.log
      - name: Retain exact-run evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-serving-peers-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/docs-serving-peers/
          if-no-files-found: error
          retention-days: 30
