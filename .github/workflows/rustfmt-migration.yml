name: one-shot Rust migration formatter

on:
  push:
    branches: [refactor/rust-contract-parity-2026-09-03]

permissions:
  contents: write

concurrency:
  group: rustfmt-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refactor/rust-contract-parity-2026-09-03
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Format and commit once
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml
          if git diff --quiet -- tools/contract-parity; then
            echo 'already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/contract-parity
          git commit -m 'style: apply rustfmt to contract parity tool'
          git push origin HEAD:refactor/rust-contract-parity-2026-09-03
