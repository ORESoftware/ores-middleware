name: one-shot Rust zpkg formatter

on:
  push:
    branches: [feat/rust-zpkg-contract-check-2026-09-03]

permissions:
  contents: write

jobs:
  format-and-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/rust-zpkg-contract-check-2026-09-03
          fetch-depth: 0

      - name: Install Rust 1.95.0 formatter
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact formatter and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/contract-parity/src/bin/zpkg_contract_check.rs
          git rm .github/workflows/zpkg-rust-autofmt-once.yml
          git diff --cached --check
          git commit -m 'style(tooling): apply Rust 1.95 formatter'
          git push origin HEAD:feat/rust-zpkg-contract-check-2026-09-03
