name: Canonical TJSV runtime artifact

on:
  push:
    branches:
      - DEN-390-ores-cli-pr37-real-tjsv-probe

permissions:
  contents: read

concurrency:
  group: canonical-tjsv-runtime-artifact
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out canonical validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 2281843126ab644607b11cf8281d84f382d68dfc
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2281843126ab644607b11cf8281d84f382d68dfc
          git diff --check

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install from committed lockfile and smoke executable
        run: |
          set -euo pipefail
          npm ci
          node bin/typespec-json-schema-validator.mjs --version

      - name: Package public runtime
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/tjsv-runtime.tar.gz" .
          sha256sum "$RUNNER_TEMP/tjsv-runtime.tar.gz" > "$RUNNER_TEMP/tjsv-runtime.sha256"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tjsv-runtime-2281843126ab644607b11cf8281d84f382d68dfc
          path: |
            ${{ runner.temp }}/tjsv-runtime.tar.gz
            ${{ runner.temp }}/tjsv-runtime.sha256
          if-no-files-found: error
          retention-days: 1
