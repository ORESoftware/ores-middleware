name: one-shot bootstrap Zed release acceptance

on:
  push:
    branches:
      - test/zed-release-acceptance-2026-09-03

permissions:
  contents: write

concurrency:
  group: one-shot-bootstrap-zed-release-acceptance
  cancel-in-progress: false

jobs:
  lock-format-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/zed-release-acceptance-2026-09-03
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Generate the standalone lock and run static gates
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path tools/zed-archive-audit/Cargo.toml
          cargo fmt --manifest-path tools/zed-archive-audit/Cargo.toml --all
          cargo fmt --manifest-path tools/zed-archive-audit/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/zed-archive-audit/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path tools/zed-archive-audit/Cargo.toml --locked
          bash -n scripts/run-zed-release-acceptance.sh
          docker run --rm -v "${PWD}:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color .github/workflows/zed-release-acceptance.yml
          git diff --check

      - name: Commit the tested source and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/run-zed-release-acceptance.sh
          rm .github/workflows/zed-release-acceptance-bootstrap-one-shot.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/zed-archive-audit/Cargo.toml \
            tools/zed-archive-audit/Cargo.lock \
            tools/zed-archive-audit/src/lib.rs \
            tools/zed-archive-audit/src/main.rs \
            scripts/run-zed-release-acceptance.sh \
            .github/workflows/zed-release-acceptance.yml \
            .github/workflows/zed-release-acceptance-bootstrap-one-shot.yml
          git commit -m "test: add executable Zed pack-install acceptance"
          git push origin HEAD:test/zed-release-acceptance-2026-09-03
