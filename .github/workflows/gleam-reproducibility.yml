name: gleam-reproducibility

on:
  pull_request:
    paths:
      - "src/gleam/**"
      - "tools/middleware-adversarial-runner/**"
      - ".github/workflows/gleam-reproducibility.yml"
  push:
    branches: [main, dev]
    paths:
      - "src/gleam/**"
      - "tools/middleware-adversarial-runner/**"
      - ".github/workflows/gleam-reproducibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gleam-reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gleam:
    name: gleam-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          elixir-version: "1.18.4"
          gleam-version: "1.18.1"
          rebar3-version: "3.24.0"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Resolve and compile with zero manifest drift
        shell: bash
        run: |
          set -euo pipefail
          cd src/gleam
          gleam build
          git diff --exit-code -- gleam.toml manifest.toml

      - name: Enforce Gleam source formatting
        shell: bash
        run: |
          set -euo pipefail
          cd src/gleam
          gleam format --check src test

      - name: Run native Gleam middleware suite repeatedly
        shell: bash
        run: |
          set -euo pipefail
          cd src/gleam
          for iteration in 1 2 3 4 5; do
            echo "Gleam reproducibility iteration $iteration"
            gleam test
          done

      - name: Validate declared runtime adapter surface
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .language == "gleam" and
            .runtime == "erlang-otp" and
            .packageName == "ores_middleware" and
            (.frameworkAdapters | index("gleam-http")) != null and
            (.frameworkAdapters | index("otp")) != null and
            .operationSymbols.descriptor == "descriptor" and
            .operationSymbols.currentContext == "current_context"
          ' src/gleam/adapter.manifest.json

      - name: Validate live Gleam runtime descriptor
        shell: bash
        working-directory: src/gleam
        run: |
          set -euo pipefail
          gleam run -m ores_middleware_contractcheck | jq -e '
            .language == "gleam" and
            .contractVersion == "1.0.0"
          '

      - name: Run compiled randomized adversarial Gleam suite
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet \
            --manifest-path tools/middleware-adversarial-runner/Cargo.toml \
            --package middleware-adversarial-runner \
            -- \
            --language gleam \
            --iterations 10 \
            --output-dir target/reproducibility/gleam/logs \
            --receipt target/reproducibility/gleam/receipt.json
          jq -e '.passed == true and (.runs | length) == 10 and all(.runs[]; .passed == true and .exit_code == 0)' target/reproducibility/gleam/receipt.json

      - name: Prove validation did not rewrite tracked Gleam source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code -- src/gleam
