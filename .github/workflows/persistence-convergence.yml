name: persistence-convergence

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "19 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-convergence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orm-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Install PostgreSQL client and libpq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql-client

      - name: Run offline generator and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/contract-parity/Cargo.toml -- --check
          cargo test --manifest-path tools/contract-parity/Cargo.toml --all-targets
          python3 -m unittest \
            scripts/test_orm_catalog_gate.py \
            scripts/test_orm_matrix_gate.py \
            scripts/test_subprocess_capture.py \
            -v

      - name: Compile four real ORM witnesses and compare PostgreSQL catalogs
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          python3 scripts/orm_matrix_gate.py

      - name: Upload execution receipts, lockfile, sources, SQL, catalogs, and polyglot outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistence-convergence-${{ github.run_id }}
          path: |
            scripts/orm_catalog_gate.py
            scripts/orm_matrix_gate.py
            scripts/subprocess_capture.py
            scripts/test_orm_catalog_gate.py
            scripts/test_orm_matrix_gate.py
            scripts/test_subprocess_capture.py
            target/orm-matrix-gate/receipt.json
            target/orm-matrix-gate/catalog/*.json
            target/orm-matrix-gate/sql/*.sql
            target/orm-matrix-gate/rust-witness/Cargo.toml
            target/orm-matrix-gate/rust-witness/Cargo.lock
            target/orm-matrix-gate/rust-witness/src/main.rs
            target/schema-convergence/**/*
          if-no-files-found: error
          retention-days: 90
