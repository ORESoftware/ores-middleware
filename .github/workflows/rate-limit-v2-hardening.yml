name: rate-limit-v2-hardening

on:
  pull_request:
    paths:
      - "contracts/rate-limit-v2/**"
      - "scripts/validate-rate-limit-v2.mjs"
      - "src/rust/src/middleware_order.rs"
      - "src/rust/src/rate_limit_v2.rs"
      - "src/rust/src/lib.rs"
      - "formal/rate-limit-pipeline/**"
      - "package.json"
      - ".github/workflows/rate-limit-v2-hardening.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/rate-limit-v2/**"
      - "scripts/validate-rate-limit-v2.mjs"
      - "src/rust/src/middleware_order.rs"
      - "src/rust/src/rate_limit_v2.rs"
      - "src/rust/src/lib.rs"
      - "formal/rate-limit-pipeline/**"
      - "package.json"
      - ".github/workflows/rate-limit-v2-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-limit-v2-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-rust-and-formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 1

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install locked contract toolchain
        run: npm ci --ignore-scripts

      - name: Compile independent TypeSpec authority
        run: npx tsp compile contracts/rate-limit-v2/typespec --no-emit

      - name: Validate JSON Schema, fixtures, and peer parity
        run: node scripts/validate-rate-limit-v2.mjs

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Format Rate Limit V2 Rust modules
        run: rustfmt --edition 2024 --check src/rust/src/middleware_order.rs src/rust/src/rate_limit_v2.rs

      - name: Lint Rust middleware
        run: cargo clippy --manifest-path src/rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test compile-time and runtime policy invariants
        run: cargo test --manifest-path src/rust/Cargo.toml --all-features

      - name: Install Java for TLA+
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned TLA+ model checker
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" | sha1sum --check

      - name: Model-check middleware ordering and strict outage behavior
        run: |
          set -euo pipefail
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/rate-limit-pipeline/RateLimitPipeline.cfg \
            formal/rate-limit-pipeline/RateLimitPipeline.tla

      - name: Retain sanitized contract receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rate-limit-v2-contract-${{ github.run_id }}
          path: target/rate-limit-v2/receipt.json
          if-no-files-found: error
          retention-days: 90
