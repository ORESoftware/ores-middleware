name: DEN-3959 one-shot Go normalization

on:
  push:
    branches: [DEN-3959-go-reproducibility-gate]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3959-go-reproducibility-gate
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.0"
          cache: false
      - name: Normalize, remove one-shot workflow, and commit
        shell: bash
        run: |
          set -euo pipefail
          find src/golang -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --check
          git rm .github/workflows/DEN-3959-gofmt-normalize.yml
          git add -- src/golang
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-3959): normalize Go source with gofmt 1.25.0'
          git push origin HEAD:DEN-3959-go-reproducibility-gate
