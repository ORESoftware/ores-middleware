name: apply-rust-http-lifecycle-boundary

on:
  push:
    branches:
      - agent/rust-http-lifecycle-boundary-20260903

permissions:
  contents: write

concurrency:
  group: apply-rust-http-lifecycle-boundary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/rust-http-lifecycle-boundary-20260903
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Preserve established handler outcome events
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".agent-patches/apply_rust_lifecycle.py")
          text = path.read_text(encoding="utf-8")

          declaration = "let (outcome, status, code, detail) = match failure.kind {"
          if text.count(declaration) != 1:
              raise SystemExit("expected one handler outcome declaration")
          text = text.replace(
              declaration,
              "let (outcome, status, code, detail, log_message) = match failure.kind {",
              1,
          )

          text = text.replace(
              '                    "request deadline exceeded",\n                ),',
              '                    "request deadline exceeded",\n                    "request handler timed out",\n                ),',
              1,
          )
          text = text.replace(
              '                    "request was cancelled",\n                ),',
              '                    "request was cancelled",\n                    "request handler cancelled",\n                ),',
              1,
          )

          combined = '''                OperationFailureKind::Error | OperationFailureKind::Panic => (
                    "panic",
                    500,
                    "internal_error",
                    "request handler failed",
                ),'''
          split = '''                OperationFailureKind::Error => (
                    "error",
                    500,
                    "internal_error",
                    "request handler failed",
                    "request handler failed",
                ),
                OperationFailureKind::Panic => (
                    "panic",
                    500,
                    "internal_error",
                    "request handler failed",
                    "request handler panicked",
                ),'''
          if text.count(combined) != 1:
              raise SystemExit("expected one combined error/panic arm")
          text = text.replace(combined, split, 1)

          old_message = '.error(vec![Value::String("request handler failed".into())])'
          if text.count(old_message) != 1:
              raise SystemExit("expected one generic handler failure message")
          text = text.replace(
              old_message,
              '.error(vec![Value::String(log_message.into())])',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply exact source transformations
        run: python3 .agent-patches/apply_rust_lifecycle.py

      - name: Format, lint, and test Rust package
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2024 src/rust/src/pipeline.rs src/rust/src/frameworks/axum.rs
          # Keep warnings denied for the new lifecycle code while excluding only
          # the four known lint classes already present on the untouched base.
          cargo clippy --manifest-path src/rust/Cargo.toml --all-targets --all-features -- \
            -D warnings \
            -A clippy::collapsible_if \
            -A clippy::obfuscated_if_else \
            -A clippy::derivable_impls \
            -A clippy::too_many_arguments
          cargo test --manifest-path src/rust/Cargo.toml --all-features

      - name: Commit verified source-only result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .agent-patches/apply_rust_lifecycle.py
          rmdir .agent-patches 2>/dev/null || true
          rm -f .github/workflows/apply-rust-http-lifecycle-boundary.yml
          git diff --check
          git config user.name "ores-gh-bot"
          git config user.email "ores-gh-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(rust): contain the full HTTP middleware lifecycle"
          git push origin HEAD:agent/rust-http-lifecycle-boundary-20260903
