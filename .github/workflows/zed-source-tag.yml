name: zed-source-tag

on:
  pull_request:
    paths:
      - '.github/workflows/zed-source-tag.yml'
      - '.zpkg.toml'
      - 'scripts/check_zpkg.py'
      - 'scripts/test_build_targets.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zed-source-tag.yml'
      - '.zpkg.toml'
      - 'scripts/check_zpkg.py'
      - 'scripts/test_build_targets.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-source-tag-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package identity and release helpers
        run: |
          set -euo pipefail
          python3 scripts/check_zpkg.py
          python3 -m unittest scripts/test_build_targets.py -v
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('.zpkg.toml').read_text())['package']
          assert package['org'] == 'oresoftware'
          assert package['name'] == 'ores-middleware'
          assert package['version'] == '0.1.0'
          assert package['repository']['url'] == 'https://github.com/ORESoftware/ores-middleware'
          PY
      - name: Create or verify immutable source tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: 0.1.0
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ['EXPECTED_VERSION']
          tag = f'v{version}'
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          base = os.environ['GITHUB_API_URL']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ores-middleware-zed-source-tag',
          }
          ref_url = f'{base}/repos/{repository}/git/ref/tags/{tag}'
          try:
              with urllib.request.urlopen(urllib.request.Request(ref_url, headers=headers), timeout=30) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              body = json.dumps({'ref': f'refs/tags/{tag}', 'sha': sha}).encode()
              request = urllib.request.Request(
                  f'{base}/repos/{repository}/git/refs',
                  data=body,
                  headers={**headers, 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  created = json.load(response)
              if created['object']['sha'] != sha:
                  raise SystemExit('created source tag does not point to the triggering commit')
              print(f'created {tag} at {sha}')
          else:
              existing_sha = existing['object']['sha']
              if existing_sha != sha:
                  raise SystemExit(
                      f'{tag} already points to {existing_sha}; refusing to rewrite it to {sha}'
                  )
              print(f'{tag} already points to {sha}')
          PY
