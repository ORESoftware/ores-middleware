name: zed-source-tag-policy

on:
  pull_request:
    paths:
      - '.github/workflows/zed-source-tag.yml'
      - '.github/workflows/release-zed.yml'
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'scripts/check_zpkg.py'
      - 'scripts/check_zed_release_policy.py'
      - 'scripts/run-zed-release-acceptance.sh'
      - 'scripts/test_build_targets.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zed-source-tag.yml'
      - '.github/workflows/release-zed.yml'
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'scripts/check_zpkg.py'
      - 'scripts/check_zed_release_policy.py'
      - 'scripts/run-zed-release-acceptance.sh'
      - 'scripts/test_build_targets.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-source-tag-policy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package identity and release ownership
        run: |
          set -euo pipefail
          python3 scripts/check_zpkg.py
          python3 scripts/check_zed_release_policy.py
          python3 -m unittest scripts/test_build_targets.py -v
      - name: Syntax-check release shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run-zed-release-acceptance.sh

  resolve-public-release-lock:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release/zed-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out same-repository release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install checksum-verified Zed 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          readonly url='https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz'
          readonly expected='f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a'
          mkdir -p "$RUNNER_TEMP/zed-dist"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/zed.tar.gz" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP/zed-dist"
          zed_bin="$(find "$RUNNER_TEMP/zed-dist" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          printf 'ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"
          "$zed_bin" --version
      - name: Resolve public dependency closure
        shell: bash
        run: |
          set -euo pipefail
          rm -f .zpkg.lock
          "$ZED_BIN" install --install-mode copy
          "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
            > "$RUNNER_TEMP/zed-lock-validate.json"
          test -s .zpkg.lock
      - name: Verify direct dependency provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          lock = tomllib.loads(Path('.zpkg.lock').read_text())
          packages = {f"{p.get('org')}/{p.get('name')}": p for p in lock.get('packages', [])}
          required = set(manifest.get('dependencies', {}))
          missing = sorted(required - set(packages))
          if missing:
              raise SystemExit(f'missing locked direct dependencies: {missing}')
          for name in sorted(required):
              item = packages[name]
              assert item.get('version'), name
              assert re.fullmatch(r'[0-9a-f]{64}', item.get('sha256', '')), name
              assert isinstance(item.get('size'), int) and item['size'] > 0, name
              assert item.get('format'), name
              assert item.get('source'), name
              assert item.get('vcs_tag'), name
              assert re.fullmatch(r'[0-9a-f]{40}', item.get('vcs_commit', '')), name
          print(f'verified {len(required)} direct dependencies')
          PY
      - name: Commit only resolver-produced lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -- .zpkg.lock
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            echo 'resolver produced no lock delta'
            exit 0
          fi
          test "$staged" = '.zpkg.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock Zed dependency closure for middleware release'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
