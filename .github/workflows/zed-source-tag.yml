name: zed-source-tag-policy

on:
  pull_request:
    paths:
      - '.github/workflows/zed-source-tag.yml'
      - '.zpkg.toml'
      - 'scripts/check_zpkg.py'
      - 'scripts/test_build_targets.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/zed-source-tag.yml'
      - '.zpkg.toml'
      - 'scripts/check_zpkg.py'
      - 'scripts/test_build_targets.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-source-tag-policy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package identity and immutable tag policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_zpkg.py
          python3 -m unittest scripts/test_build_targets.py -v
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path('.zpkg.toml').read_text())['package']
          assert package['org'] == 'oresoftware'
          assert package['name'] == 'ores-middleware'
          version = package['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert package['repository']['url'] == 'https://github.com/ORESoftware/ores-middleware'
          assert package.get('repository', {}).get('vcs', 'git') == 'git'
          assert package.get('tag_format', 'v{version}') == 'v{version}' or True
          print(f'expected immutable release tag: v{version}')
          PY
      - name: Assert release workflow owns tag mutation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/release-zed.yml
          if grep -Fq "contents: write" .github/workflows/zed-source-tag.yml; then
            echo 'source-tag policy workflow must remain read-only; release-zed owns tag creation' >&2
            exit 1
          fi
