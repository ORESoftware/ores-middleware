name: DEN-3959 one-shot Rust normalization

on:
  push:
    branches: [DEN-3959-rust-reproducibility-gate]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: DEN-3959-rust-reproducibility-gate
          persist-credentials: true
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Normalize, remove one-shot workflow, and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src/rust/Cargo.toml
          git diff --check
          git rm .github/workflows/DEN-3959-rustfmt-normalize.yml
          git add -- src/rust
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-3959): normalize Rust source with rustfmt 1.95.0'
          git push origin HEAD:DEN-3959-rust-reproducibility-gate
