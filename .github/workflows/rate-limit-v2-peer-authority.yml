name: rate-limit-v2-peer-authority

on:
  pull_request:
    paths:
      - 'contracts/rate-limit-v2/**'
      - 'scripts/validate-rate-limit-v2.mjs'
      - 'docs/rate-limit-v2.md'
      - '.github/workflows/rate-limit-v2-peer-authority.yml'
  push:
    branches: [main, dev]
    paths:
      - 'contracts/rate-limit-v2/**'
      - 'scripts/validate-rate-limit-v2.mjs'
      - 'docs/rate-limit-v2.md'
      - '.github/workflows/rate-limit-v2-peer-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rate-limit-v2-peer-authority-${{ github.ref }}
  cancel-in-progress: true

env:
  TJSV_REVISION: d60d0d79d83e075077382623ec9e23a401ab601f
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install locked middleware dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Preserve native rate-limit contract and fixture gate
        run: npm run rate-limit-v2:check

      - name: Check out exact TJSV source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TJSV_REVISION }}
          path: target/tools/tjsv
          persist-credentials: false
          show-progress: false

      - name: Install locked TJSV dependencies
        run: |
          set -euo pipefail
          npm ci --prefix target/tools/tjsv --ignore-scripts --no-audit --no-fund
          npm rebuild --prefix target/tools/tjsv @oresoftware/f2e --ignore-scripts=false --no-audit --no-fund
          test -s target/tools/tjsv/node_modules/@oresoftware/f2e/clients/nodejs/build/Release/flags2env.node

      - name: Enforce all seven peer declarations with zero ignores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/rate-limit-v2-tjsv/generated
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" \
            node target/tools/tjsv/bin/typespec-json-schema-validator.mjs check \
              --typespec=contracts/rate-limit-v2/typespec/main.tsp \
              --schema=contracts/rate-limit-v2/json-schema/rate-limit-policy.schema.json \
              --mapping=contracts/rate-limit-v2/tjsv/mapping.json \
              --output-dir=target/rate-limit-v2-tjsv/generated \
              --bundle-id=rate-limit-v2.generated.schema.json \
              --report=target/rate-limit-v2-tjsv/report.json \
              --contract-ir=target/rate-limit-v2-tjsv/contract-ir.json \
              --probes=true \
              --max-probes=128 \
              --seal-object-schemas=false \
              --int64-strategy=number \
              --polymorphic-models-strategy=oneOf \
              --format-assertion=true \
              --quiet=true

      - name: Verify complete declaration coverage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('target/rate-limit-v2-tjsv/report.json', 'utf8'));
          const mapping = JSON.parse(fs.readFileSync('contracts/rate-limit-v2/tjsv/mapping.json', 'utf8'));
          if (mapping.declarations.length !== 7) throw new Error('expected seven explicit declaration mappings');
          for (const lane of ['typespec', 'generated', 'authored']) {
            if (!Array.isArray(mapping.ignore?.[lane]) || mapping.ignore[lane].length !== 0) {
              throw new Error(`mapping ignore.${lane} must remain empty`);
            }
          }
          if (report.status !== 'passed' || report.zeroUnexplainedFindings !== true) throw new Error('TJSV parity did not pass');
          if (!Array.isArray(report.findings) || report.findings.length !== 0) throw new Error('unexpected TJSV findings');
          for (const field of ['typespecDeclarations', 'generatedDeclarations', 'authoredDeclarations']) {
            if (report.counts?.[field] !== 7) throw new Error(`${field} must equal seven`);
          }
          if ((report.coverage?.outOfScopeTypeSpecDeclarations ?? []).length !== 0) throw new Error('out-of-scope declarations are forbidden');
          const summary = report.differential?.summary;
          if (!summary || summary.comparedDeclarations !== 7 || summary.probesEvaluated <= 0 ||
              summary.divergences !== 0 || summary.refusals !== 0) {
            throw new Error('incomplete or divergent differential evidence');
          }
          NODE

      - name: Prove numeric policy drift fails closed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = JSON.parse(fs.readFileSync('contracts/rate-limit-v2/json-schema/rate-limit-policy.schema.json', 'utf8'));
          source.$defs.RateLimitPolicyV2.properties.capacity.maximum = 999999999;
          fs.writeFileSync('target/rate-limit-v2-tjsv/drifted.schema.json', `${JSON.stringify(source, null, 2)}\n`);
          NODE
          set +e
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" \
            node target/tools/tjsv/bin/typespec-json-schema-validator.mjs validate \
              --schema=target/rate-limit-v2-tjsv/drifted.schema.json \
              --generated-schema=target/rate-limit-v2-tjsv/generated/rate-limit-v2.generated.schema.json \
              --mapping=contracts/rate-limit-v2/tjsv/mapping.json \
              --report=target/rate-limit-v2-tjsv/drift-report.json \
              --quiet
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            echo "expected semantic drift to stop evaluation with exit 2, got $rc" >&2
            exit 1
          fi

      - name: Require peer authorities and mapping unchanged by validation
        run: |
          git diff --check
          git diff --exit-code HEAD -- \
            contracts/rate-limit-v2/typespec/main.tsp \
            contracts/rate-limit-v2/json-schema/rate-limit-policy.schema.json \
            contracts/rate-limit-v2/tjsv/mapping.json \
            scripts/validate-rate-limit-v2.mjs \
            docs/rate-limit-v2.md \
            .github/workflows/rate-limit-v2-peer-authority.yml

      - name: Retain exact-head parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rate-limit-v2-tjsv-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rate-limit-v2-tjsv/
          if-no-files-found: warn
          retention-days: 30
