name: generic portability

on:
  pull_request:
    paths:
      - "src/rust/Cargo.toml"
      - "src/rust/Cargo.lock"
      - "src/rust/src/auth_provider.rs"
      - "src/rust/src/auth_stage.rs"
      - "src/rust/src/composition.rs"
      - "src/rust/src/middleware_order.rs"
      - "src/rust/src/shared_auth.rs"
      - "src/rust/tests/provider_injection.rs"
      - "src/ts/package.json"
      - "src/ts/package-lock.json"
      - "src/ts/tsconfig.json"
      - "src/ts/adapter.manifest.json"
      - "src/ts/src/generic.ts"
      - "src/ts/src/context.ts"
      - "src/ts/src/index.ts"
      - "src/ts/test/generic.test.mjs"
      - "src/golang/go.mod"
      - "src/golang/go.sum"
      - "src/golang/generic.go"
      - "src/golang/generic_http.go"
      - "src/golang/generic_test.go"
      - "src/gleam/gleam.toml"
      - "src/gleam/manifest.toml"
      - "src/gleam/src/ores_middleware.gleam"
      - "src/gleam/src/ores_middleware/generic.gleam"
      - "src/gleam/test/generic_test.gleam"
      - "src/elixir/mix.exs"
      - "src/elixir/mix.lock"
      - "src/elixir/lib/ores_middleware/generic.ex"
      - "src/elixir/test/generic_test.exs"
      - "src/erlang/rebar.config"
      - "src/erlang/rebar.lock"
      - "src/erlang/src/ores_middleware_generic.erl"
      - "src/erlang/test/ores_middleware_generic_tests.erl"
      - "tests/runtime-portability/generic-context-smoke.mjs"
      - "scripts/check-generic-portability.mjs"
      - "scripts/check-ts-package-exports.mjs"
      - "scripts/js_generic_runtime_portability.mjs"
      - "docs/GENERIC_PORTABILITY_CONTRACT.md"
      - "package.json"
      - ".github/workflows/generic-portability.yml"
      - ".github/workflows/js-runtime-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-portability-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_WORKFLOW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ORES_WORKFLOW_SOURCE_SHA }}
          persist-credentials: false
          show-progress: false
          fetch-depth: 1
      - name: Verify exact candidate revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Check cross-language generic portability contract
        run: node scripts/check-generic-portability.mjs
      - name: Check TypeScript package export and runtime metadata parity
        run: node scripts/check-ts-package-exports.mjs
      - name: Ensure guards and docs are tracked without generated drift
        run: |
          set -euo pipefail
          git diff --check
          test -f docs/GENERIC_PORTABILITY_CONTRACT.md
          test -f scripts/check-generic-portability.mjs
          test -f scripts/check-ts-package-exports.mjs
          test -f scripts/js_generic_runtime_portability.mjs
          test -f tests/runtime-portability/generic-context-smoke.mjs

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.ORES_WORKFLOW_SOURCE_SHA }}", persist-credentials: false, fetch-depth: 1 }
      - run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with: { toolchain: "1.95.0" }
      - name: Execute Rust provider and composition conformance
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path src/rust/Cargo.toml --test provider_injection
          cargo test --locked --manifest-path src/rust/Cargo.toml auth_provider::tests
          cargo test --locked --manifest-path src/rust/Cargo.toml auth_stage::tests
          cargo test --locked --manifest-path src/rust/Cargo.toml composition::tests

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.ORES_WORKFLOW_SOURCE_SHA }}", persist-credentials: false, fetch-depth: 1 }
      - run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22.23.1", package-manager-cache: false }
      - name: Build exact TypeScript package
        run: |
          set -euo pipefail
          npm ci --prefix src/ts --no-audit --no-fund
          npm --prefix src/ts run build
          node scripts/check-ts-package-exports.mjs
          git diff --exit-code -- package.json src/ts/package.json src/ts/package-lock.json
      - name: Execute generic TypeScript conformance
        run: node --test src/ts/test/generic.test.mjs

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: { GOFLAGS: -mod=readonly }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.ORES_WORKFLOW_SOURCE_SHA }}", persist-credentials: false, fetch-depth: 1 }
      - run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: "1.25.0", cache: false }
      - name: Execute generic Go conformance
        working-directory: src/golang
        run: go test -count=1 ./...

  gleam:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.ORES_WORKFLOW_SOURCE_SHA }}", persist-credentials: false, fetch-depth: 1 }
      - run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          elixir-version: "1.18.4"
          gleam-version: "1.18.1"
          rebar3-version: "3.24.0"
      - name: Build and execute generic Gleam conformance
        working-directory: src/gleam
        run: |
          set -euo pipefail
          gleam build
          gleam format --check src test
          gleam test

  elixir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: { MIX_ENV: test }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.ORES_WORKFLOW_SOURCE_SHA }}", persist-credentials: false, fetch-depth: 1 }
      - run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          elixir-version: "1.18.4"
          rebar3-version: "3.24.0"
      - name: Execute generic Elixir conformance
        working-directory: src/elixir
        run: |
          set -euo pipefail
          mix local.hex --force
          mix deps.get
          git diff --exit-code -- mix.lock
          mix format --check-formatted "lib/**/*.ex" "test/**/*.exs" mix.exs
          mix compile --warnings-as-errors
          mix test test/generic_test.exs --trace

  erlang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.ORES_WORKFLOW_SOURCE_SHA }}", persist-credentials: false, fetch-depth: 1 }
      - run: test "$(git rev-parse HEAD)" = "$ORES_WORKFLOW_SOURCE_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27.3.4.14"
          rebar3-version: "3.24.0"
      - name: Execute generic Erlang conformance
        working-directory: src/erlang
        run: |
          set -euo pipefail
          rebar3 compile
          rebar3 eunit --module=ores_middleware_generic_tests
