name: temporary Gleam formatter apply
on:
  workflow_dispatch:
  push:
    branches: [feat/auth-provider-injection]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3.4.14"
          gleam-version: "1.18.1"
          rebar3-version: "3.24.0"
      - run: |
          set -euo pipefail
          cd src/gleam
          gleam format src test
          cd ../..
          if git diff --quiet -- src/gleam; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gleam
          git commit -m "style: apply canonical Gleam formatting"
          git push origin HEAD:feat/auth-provider-injection
