# Static ORES trace-marker compatibility guard.
#
# Public compatibility/admission remains
# `^ores-(trace|routine)-[A-Za-z0-9_-]{12,64}$`.
# Current ORES generators mint canonical 21-character nanoid suffixes; that
# generator convention is tested separately and does not narrow wire admission.
name: ORES trace marker contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ores-trace-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the contract checker
        run: rustc --edition=2021 -D warnings -O -o "$RUNNER_TEMP/ores-trace-contract" .github/ores-trace-contract.rs

      - name: Self-test compatibility and generator invariants
        run: |
          rustc --edition=2021 -D warnings --test -o "$RUNNER_TEMP/ores-trace-contract-test" .github/ores-trace-contract.rs
          "$RUNNER_TEMP/ores-trace-contract-test"

      - name: Verify static ORES trace markers
        run: |
          "$RUNNER_TEMP/ores-trace-contract" .
