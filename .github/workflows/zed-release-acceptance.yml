name: zed-release-acceptance

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'contracts/**'
      - 'src/**'
      - 'scripts/build_targets.py'
      - 'scripts/check_zpkg.py'
      - 'scripts/cross_translate.py'
      - 'scripts/installed_package_smoke.py'
      - 'scripts/test_build_targets.py'
      - 'scripts/run-zed-release-acceptance.sh'
      - 'tools/zed-archive-audit/**'
      - '.github/workflows/zed-release-acceptance.yml'
  push:
    branches: [main, dev, 'release/zed-*']
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'contracts/**'
      - 'src/**'
      - 'scripts/build_targets.py'
      - 'scripts/check_zpkg.py'
      - 'scripts/cross_translate.py'
      - 'scripts/installed_package_smoke.py'
      - 'scripts/test_build_targets.py'
      - 'scripts/run-zed-release-acceptance.sh'
      - 'tools/zed-archive-audit/**'
      - '.github/workflows/zed-release-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-release-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-release-lock:
    if: >-
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'release/zed-') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/heads/release/zed-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: zed-pkg
    permissions:
      contents: write
    steps:
      - name: Check out the same-repository release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-verified Zed 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          readonly url='https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz'
          readonly expected='f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a'
          mkdir -p "$RUNNER_TEMP/zed-dist"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/zed.tar.gz" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP/zed-dist"
          zed_bin="$(find "$RUNNER_TEMP/zed-dist" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          printf 'ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"
          "$zed_bin" --version

      - name: Reuse a complete lock or resolve it from the registry
        env:
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if test -s .zpkg.lock && \
             "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
               > "$RUNNER_TEMP/zed-existing-lock.json" 2>/dev/null; then
            printf '%s\n' 'existing .zpkg.lock is structurally valid; checking direct provenance coverage'
          else
            rm -f .zpkg.lock
            if test -z "$ZED_PKG_TOKEN"; then
              printf '%s\n' 'ZED_PKG_TOKEN is required only when .zpkg.lock is missing or invalid' >&2
              exit 2
            fi
            attempt=1
            max_attempts=3
            until "$ZED_BIN" install --install-mode copy; do
              if test "$attempt" -ge "$max_attempts"; then
                printf 'authenticated registry resolution failed after %s attempts\n' "$attempt" >&2
                exit 1
              fi
              delay=$((attempt * 5))
              printf 'authenticated registry resolution attempt %s failed; retrying in %ss\n' "$attempt" "$delay" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          fi
          test -s .zpkg.lock
          "$ZED_BIN" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
            > "$RUNNER_TEMP/zed-lock-validate.json"

      - name: Verify every direct dependency has immutable provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('.zpkg.toml').read_text())
          lock = tomllib.loads(Path('.zpkg.lock').read_text())
          locked = {
              f"{item.get('org')}/{item.get('name')}": item
              for item in lock.get('packages', [])
          }
          required = set(manifest.get('dependencies', {}))
          missing = sorted(required - set(locked))
          if missing:
              raise SystemExit(f'direct dependencies missing from .zpkg.lock: {missing}')
          for name in sorted(required):
              item = locked[name]
              assert item.get('version'), name
              assert re.fullmatch(r'[0-9a-f]{64}', item.get('sha256', '')), name
              assert isinstance(item.get('size'), int) and item['size'] > 0, name
              assert item.get('format'), name
              assert item.get('source'), name
              assert item.get('vcs_tag'), name
              assert re.fullmatch(r'[0-9a-f]{40}', item.get('vcs_commit', '')), name
          print(f'verified {len(required)} direct dependency lock entries')
          PY

      - name: Commit only a resolver-produced lock delta
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- .zpkg.lock
          staged="$(git diff --cached --name-only)"
          if test -z "$staged"; then
            printf '%s\n' 'resolver produced no lock delta'
            exit 0
          fi
          test "$staged" = '.zpkg.lock'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lock Zed dependency closure for middleware release'
          auth="$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
          unset auth

      - name: Upload sanitized resolver evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zed-lock-resolution-${{ github.run_id }}
          path: |
            .zpkg.lock
            ${{ runner.temp }}/zed-lock-validate.json
          if-no-files-found: warn
          retention-days: 30

  reproducibility-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.0'
          cache: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '27'
          elixir-version: '1.18'
          gleam-version: '1.18.1'
          rebar3-version: 'latest'

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install checksum-verified Zed 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          readonly url='https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz'
          readonly expected='f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a'
          mkdir -p "$RUNNER_TEMP/zed-dist"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/zed.tar.gz" "$url"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/zed.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zed.tar.gz" -C "$RUNNER_TEMP/zed-dist"
          zed_bin="$(find "$RUNNER_TEMP/zed-dist" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          printf 'ZED_BIN=%s\n' "$zed_bin" >>"$GITHUB_ENV"
          "$zed_bin" --version

      - name: Install checked-in package dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund

      - name: Validate release scripts and self-contained output guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/build_targets.py \
            scripts/check_zpkg.py \
            scripts/cross_translate.py \
            scripts/installed_package_smoke.py
          python3 scripts/check_zpkg.py
          python3 -m unittest scripts/test_build_targets.py -v

      - name: Run native target tests before packaging
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src/rust/Cargo.toml --all-features
          npm test --prefix src/ts
          (cd src/golang && go test -race -shuffle=on -count=2 ./...)
          (cd src/gleam && gleam format --check src test && gleam test)
          (cd src/elixir && mix deps.get && mix test)
          (cd src/erlang && rebar3 eunit)

      - name: Test the typed archive auditor
        run: |
          cargo fmt --manifest-path tools/zed-archive-audit/Cargo.toml --all -- --check
          cargo clippy --manifest-path tools/zed-archive-audit/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path tools/zed-archive-audit/Cargo.toml --locked

      - name: Execute credential-free reproducibility acceptance
        shell: bash
        env:
          ZED_ACCEPTANCE_RECEIPT_DIR: ${{ runner.temp }}/zed-acceptance
          ZED_ACCEPTANCE_SOURCE_COMMIT: ${{ github.sha }}
        run: bash scripts/run-zed-release-acceptance.sh

      - name: Upload immutable receipt evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-release-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zed-acceptance/receipt.json
            ${{ runner.temp }}/zed-acceptance/acceptance-scope.json
            ${{ runner.temp }}/zed-acceptance/validate.json
            ${{ runner.temp }}/zed-acceptance/zed-version.txt
            ${{ runner.temp }}/zed-acceptance/expected-archives.txt
            ${{ runner.temp }}/zed-acceptance/package-first-names.txt
            ${{ runner.temp }}/zed-acceptance/package-second-names.txt
            ${{ runner.temp }}/zed-acceptance/package-first-digests.txt
            ${{ runner.temp }}/zed-acceptance/package-second-digests.txt
          if-no-files-found: error
          retention-days: 90
