name: persistence-tjsv-salvage

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-tjsv-salvage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Check out immutable upstream TJSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 4473504c4c9d2831d825919f70c03994d8ce01d2
          path: target/tools/tjsv
          persist-credentials: false
          show-progress: false
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix target/tools/tjsv --ignore-scripts --no-audit --no-fund
      - name: Run salvaged persistence TJSV controls
        run: |
          set -o pipefail
          mkdir -p target/persistence-tjsv-salvage
          node --test tests/persistence-tjsv-salvage.test.mjs 2>&1 | tee target/persistence-tjsv-salvage/tests.log
      - name: Preserve compiler and cross-translation behavior
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run contracts:compile 2>&1 | tee target/persistence-tjsv-salvage/compile.log
          npm run contracts:cross-translate 2>&1 | tee target/persistence-tjsv-salvage/cross-translate.log
      - name: Retain evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: persistence-tjsv-salvage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/persistence-tjsv-salvage/
          if-no-files-found: error
          retention-days: 30
