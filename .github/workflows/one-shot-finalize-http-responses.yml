name: one-shot-finalize-http-responses

on:
  push:
    branches:
      - agent/ts-http-lifecycle-boundary-20260903
    paths:
      - .github/workflows/one-shot-finalize-http-responses.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: src/ts/package-lock.json

      - name: Apply total response finalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ts/src/index.ts")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              "\n".join([
                  "    response = await attachEtag(request, response);",
                  "    response = attachHeaders(config, context, response);",
                  "    response = maybeCompress(config, request, response);",
                  "    const durationMs = Math.max(0, now() - started);",
              ]),
              "\n".join([
                  "    response = await attachEtag(request, response);",
                  "    response = maybeCompress(config, request, response);",
                  "    // Observers and persistence consume the semantic response before",
                  "    // request-specific security and correlation headers are finalized.",
                  "    const durationMs = Math.max(0, now() - started);",
              ]),
              "handler finalization",
          )

          replace_once(
              "\n".join([
                  "    return authenticatedOutcome.ok",
                  "      ? authenticatedOutcome.value",
                  "      : operationFailureResponse(config, context, authenticatedOutcome.failure);",
              ]),
              "\n".join([
                  "    const response = authenticatedOutcome.ok",
                  "      ? authenticatedOutcome.value",
                  "      : operationFailureResponse(authenticatedOutcome.failure);",
                  "    return attachHeaders(config, context, response);",
              ]),
              "authenticated outcome",
          )

          replace_once(
              "\n".join([
                  "    return preAuthOutcome.ok",
                  "      ? preAuthOutcome.value",
                  "      : operationFailureResponse(config, context, preAuthOutcome.failure);",
              ]),
              "\n".join([
                  "    const response = preAuthOutcome.ok",
                  "      ? preAuthOutcome.value",
                  "      : operationFailureResponse(preAuthOutcome.failure);",
                  "    return attachHeaders(config, context, response);",
              ]),
              "pre-auth outcome",
          )

          replace_once(
              "\n".join([
                  "function operationFailureResponse(",
                  "  config: MiddlewareConfig,",
                  "  context: RequestContext,",
                  "  failure: OperationFailure",
                  "): Response {",
                  "  const response = failure.kind === \"deadline_exceeded\"",
                  "    ? problem(504, \"deadline_exceeded\", \"request deadline exceeded\")",
                  "    : failure.kind === \"cancelled\"",
                  "      ? problem(499, \"request_cancelled\", \"request was cancelled\")",
                  "      : problem(500, \"internal_error\", \"request processing failed\");",
                  "  return attachHeaders(config, context, response);",
                  "}",
              ]),
              "\n".join([
                  "function operationFailureResponse(failure: OperationFailure): Response {",
                  "  return failure.kind === \"deadline_exceeded\"",
                  "    ? problem(504, \"deadline_exceeded\", \"request deadline exceeded\")",
                  "    : failure.kind === \"cancelled\"",
                  "      ? problem(499, \"request_cancelled\", \"request was cancelled\")",
                  "      : problem(500, \"internal_error\", \"request processing failed\");",
                  "}",
              ]),
              "failure response",
          )

          replace_once(
              '  headers.append("vary", "accept, accept-encoding");',
              '  mergeVary(headers, "accept", "accept-encoding");',
              "outer Vary",
          )
          replace_once(
              'headers.append("vary", "accept-encoding");',
              'mergeVary(headers, "accept-encoding");',
              "compression Vary",
          )

          anchor = "function attachHeaders(config: MiddlewareConfig, context: RequestContext, response: Response): Response {"
          if source.count(anchor) != 1:
              raise SystemExit("attachHeaders anchor drifted")
          helper = "\n".join([
              "function mergeVary(headers: Headers, ...tokens: string[]): void {",
              '  const existing = headers.get("vary");',
              '  if (existing?.trim() === "*") return;',
              "  const values = new Map<string, string>();",
              '  for (const value of [...(existing?.split(",") ?? []), ...tokens]) {',
              "    const trimmed = value.trim();",
              "    if (!trimmed) continue;",
              "    const key = trimmed.toLowerCase();",
              "    if (!values.has(key)) values.set(key, key);",
              "  }",
              '  if (values.size > 0) headers.set("vary", [...values.values()].join(", "));',
              '  else headers.delete("vary");',
              "}",
              "",
          ])
          source = source.replace(anchor, helper + anchor, 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Run complete TypeScript suite
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix src/ts --ignore-scripts --no-audit --no-fund
          npm test --prefix src/ts

      - name: Commit verified source change
        shell: bash
        env:
          BRANCH: agent/ts-http-lifecycle-boundary-20260903
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/ts/src/index.ts
          git config user.name "ORESoftware"
          git config user.email "alex@oresoftware.com"
          git commit -m 'fix(ts): finalize every HTTP response exactly once'
          git push origin "HEAD:${BRANCH}"
