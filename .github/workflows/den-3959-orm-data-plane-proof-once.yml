name: Prove DEN-3959 four-way ORM data plane once

on:
  push:
    branches:
      - fix/den-3959-no-asymmetric-orm-gate
    paths:
      - .github/workflows/den-3959-orm-data-plane-proof-once.yml
      - scripts/orm_data_plane_gate.py
      - scripts/test_orm_data_plane_gate.py

permissions:
  contents: read

concurrency:
  group: den-3959-orm-data-plane-proof-once
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install PostgreSQL client and libpq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql-client
      - name: Run fail-closed generator tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/orm_data_plane_gate.py scripts/test_orm_data_plane_gate.py
          python3 -m unittest scripts/test_orm_data_plane_gate.py -v
      - name: Execute TypeSpec and JSON Schema through Diesel and SeaORM
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          python3 scripts/orm_data_plane_gate.py
          jq -e '
            .schema == "ores.orm-data-plane-convergence-report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            (.witnesses | keys | sort == [
              "json-schema-openapi-diesel",
              "json-schema-openapi-seaorm",
              "typespec-diesel",
              "typespec-seaorm"
            ]) and
            ([.witnesses[].witness.rejections[] | select(. == true)] | length) == 24
          ' target/orm-data-plane-gate/receipt.json
      - name: Upload row-level receipts and generated witnesses
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orm-data-plane-${{ github.run_id }}
          path: |
            target/orm-data-plane-gate/receipt.json
            target/orm-data-plane-gate/sql/*.sql
            target/orm-data-plane-gate/witnesses/*.json
            target/orm-data-plane-gate/rust-data-plane/Cargo.toml
            target/orm-data-plane-gate/rust-data-plane/Cargo.lock
            target/orm-data-plane-gate/rust-data-plane/src/main.rs
          if-no-files-found: error
          retention-days: 90
