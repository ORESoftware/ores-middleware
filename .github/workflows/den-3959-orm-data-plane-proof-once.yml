name: Prove DEN-3959 four-way ORM data plane once

on:
  push:
    branches:
      - fix/den-3959-no-asymmetric-orm-gate
    paths:
      - .github/workflows/den-3959-orm-data-plane-proof-once.yml
      - scripts/orm_data_plane_gate.py
      - scripts/test_orm_data_plane_gate.py

permissions:
  contents: write

concurrency:
  group: den-3959-orm-data-plane-proof-once
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install PostgreSQL client and libpq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql-client
      - name: Apply fail-closed schema and dependency hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          gate = Path("scripts/orm_catalog_gate.py")
          text = gate.read_text(encoding="utf-8")
          old = '''def apply_lane(database_url: str, schema: str, sql: str) -> None:
              if schema not in {"typespec_lane", "json_schema_lane"}:
          '''
          new = '''ALLOWED_CATALOG_SCHEMAS = frozenset(
              {
                  "typespec_lane",
                  "json_schema_lane",
                  "typespec_data_plane",
                  "json_schema_data_plane",
              }
          )


          def apply_lane(database_url: str, schema: str, sql: str) -> None:
              if schema not in ALLOWED_CATALOG_SCHEMAS:
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one catalog-schema guard, found {text.count(old)}"
              )
          gate.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("scripts/test_orm_catalog_gate.py")
          text = tests.read_text(encoding="utf-8")
          import_anchor = "from scripts.orm_catalog_gate import (\n"
          if "    ALLOWED_CATALOG_SCHEMAS,\n" not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("missing ORM catalog import anchor")
              text = text.replace(
                  import_anchor,
                  import_anchor + "    ALLOWED_CATALOG_SCHEMAS,\n",
                  1,
              )
          method = '''
              def test_catalog_schema_allowlist_is_exact(self) -> None:
                  self.assertEqual(
                      ALLOWED_CATALOG_SCHEMAS,
                      {
                          "typespec_lane",
                          "json_schema_lane",
                          "typespec_data_plane",
                          "json_schema_data_plane",
                      },
                  )
          '''
          footer = '\n\nif __name__ == "__main__":\n'
          if method.strip() not in text:
              if footer not in text:
                  raise SystemExit("missing ORM catalog test footer")
              text = text.replace(footer, method + footer, 1)
          tests.write_text(text, encoding="utf-8")

          data_plane = Path("scripts/orm_data_plane_gate.py")
          text = data_plane.read_text(encoding="utf-8")
          dependency_anchor = '''sea-orm = {{ version = "={SEA_ORM_VERSION}", default-features = false, features = ["macros", "with-chrono", "sqlx-postgres", "runtime-tokio-rustls"] }}
          serde_json = "1"
          '''
          dependency_replacement = '''sea-orm = {{ version = "={SEA_ORM_VERSION}", default-features = false, features = ["macros", "with-chrono", "sqlx-postgres", "runtime-tokio-rustls"] }}
          # SQLx's PostgreSQL stringprep path enables tinyvec's alloc surface.
          # Explicit std feature unification keeps tinyvec 1.13.0 compilable on
          # the pinned Rust toolchain without broadening database backends.
          tinyvec = {{ version = "=1.13.0", default-features = false, features = ["std"] }}
          serde_json = "1"
          '''
          if text.count(dependency_anchor) != 1:
              raise SystemExit(
                  "expected one SeaORM dependency anchor, found "
                  f"{text.count(dependency_anchor)}"
              )
          data_plane.write_text(
              text.replace(dependency_anchor, dependency_replacement, 1),
              encoding="utf-8",
          )

          tests = Path("scripts/test_orm_data_plane_gate.py")
          text = tests.read_text(encoding="utf-8")
          assertion_anchor = '''        self.assertIn('"runtime-tokio-rustls"', cargo)
          '''
          assertion_replacement = assertion_anchor + '''        self.assertIn(
              'tinyvec = { version = "=1.13.0", default-features = false, features = ["std"] }',
              cargo,
          )
          '''
          if text.count(assertion_anchor) != 1:
              raise SystemExit(
                  f"expected one runtime feature assertion, found {text.count(assertion_anchor)}"
              )
          tests.write_text(
              text.replace(assertion_anchor, assertion_replacement, 1),
              encoding="utf-8",
          )
          PY
          python3 -m py_compile \
            scripts/orm_catalog_gate.py \
            scripts/test_orm_catalog_gate.py \
            scripts/orm_data_plane_gate.py \
            scripts/test_orm_data_plane_gate.py
      - name: Run fail-closed generator tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            scripts/test_orm_catalog_gate.py \
            scripts/test_orm_data_plane_gate.py \
            -v
      - name: Execute TypeSpec and JSON Schema through Diesel and SeaORM
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          python3 scripts/orm_data_plane_gate.py
          jq -e '
            .schema == "ores.orm-data-plane-convergence-report/v1" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            (.witnesses | keys | sort == [
              "json-schema-openapi-diesel",
              "json-schema-openapi-seaorm",
              "typespec-diesel",
              "typespec-seaorm"
            ]) and
            ([.witnesses[].witness.rejections[] | select(. == true)] | length) == 24
          ' target/orm-data-plane-gate/receipt.json
      - name: Upload row-level receipts and generated witnesses
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orm-data-plane-${{ github.run_id }}
          path: |
            target/orm-data-plane-gate/receipt.json
            target/orm-data-plane-gate/sql/*.sql
            target/orm-data-plane-gate/witnesses/*.json
            target/orm-data-plane-gate/rust-data-plane/Cargo.toml
            target/orm-data-plane-gate/rust-data-plane/Cargo.lock
            target/orm-data-plane-gate/rust-data-plane/src/main.rs
          if-no-files-found: error
          retention-days: 90
      - name: Commit only proven source changes and remove this workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/orm_catalog_gate.py \
            scripts/test_orm_catalog_gate.py \
            scripts/orm_data_plane_gate.py \
            scripts/test_orm_data_plane_gate.py
          git rm -- .github/workflows/den-3959-orm-data-plane-proof-once.yml
          unexpected="$(git diff --cached --name-only | grep -Ev '^(scripts/orm_catalog_gate.py|scripts/test_orm_catalog_gate.py|scripts/orm_data_plane_gate.py|scripts/test_orm_data_plane_gate.py|\.github/workflows/den-3959-orm-data-plane-proof-once\.yml)$' || true)"
          test -z "$unexpected"
          git commit -m 'fix(DEN-3959): prove four ORM data-plane lanes'
          git push origin HEAD:refs/heads/fix/den-3959-no-asymmetric-orm-gate
