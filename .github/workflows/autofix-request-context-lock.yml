name: autofix-request-context-lock

on:
  push:
    branches:
      - feat/shared-request-context-current-main-20260918
    paths:
      - '.github/workflows/autofix-request-context-lock.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-request-context-current-main-20260918
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0

      - name: Generate Cargo lock delta from authored manifest
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --manifest-path src/rust/Cargo.toml --format-version 1 >/dev/null
          git diff --exit-code -- src/rust/Cargo.toml src/rust/src/context.rs
          test -s Cargo.lock
          git diff -- Cargo.lock

      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git rm .github/workflows/autofix-request-context-lock.yml
          if git diff --cached --quiet; then
            echo 'No lock delta produced; refusing to manufacture a commit.' >&2
            exit 1
          fi
          git commit -m 'chore(rust): refresh lock for canonical request context'
          git push origin HEAD:feat/shared-request-context-current-main-20260918
