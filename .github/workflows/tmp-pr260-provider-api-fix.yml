name: tmp-pr260-provider-api-fix

on:
  push:
    branches:
      - fix/export-edge-provider-api-and-local-host-20260922
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/export-edge-provider-api-and-local-host-20260922
          fetch-depth: 1
          persist-credentials: true
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Repair closure lifetime and final-response admission
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          provider = Path('src/rust/src/provider_api.rs')
          text = provider.read_text()
          needle = 'Fut: Future<Output = Result<EdgeMinimalDecision, IntegrationError>> + Send,'
          if text.count(needle) != 2:
              raise SystemExit(f'edge_minimal Fut bound drifted: {text.count(needle)}')
          text = text.replace(needle, needle[:-1] + " + 'static,")
          needle = 'Fut: Future<Output = Result<StageResponse, IntegrationError>> + Send,'
          if text.count(needle) != 2:
              raise SystemExit(f'edge_fetch Fut bound drifted: {text.count(needle)}')
          text = text.replace(needle, needle[:-1] + " + 'static,")
          provider.write_text(text)

          host = Path('src/rust/src/hosts/edge_minimal_local.rs')
          text = host.read_text()
          old = 'if !(100..=599).contains(&response.status) {'
          if text.count(old) != 1:
              raise SystemExit('short-circuit status guard drifted')
          text = text.replace(old, 'if !(200..=599).contains(&response.status) {', 1)
          old = '"edge_minimal short-circuit response must use an HTTP status code".to_owned(),'
          if text.count(old) != 1:
              raise SystemExit('short-circuit status diagnostic drifted')
          text = text.replace(old, '"edge_minimal short-circuit response must use a final HTTP status code (200..=599)".to_owned(),', 1)

          marker = '    // Reuse the host ABI\'s canonical header-name/value admission rather than\n'
          if text.count(marker) != 1:
              raise SystemExit('response header validation marker drifted')
          guard = '''    for name in response.headers.keys() {
        if matches!(
            name.as_str(),
            "content-length"
                | "transfer-encoding"
                | "connection"
                | "keep-alive"
                | "proxy-connection"
                | "upgrade"
                | "te"
                | "trailer"
        ) {
            return Err(IntegrationError {
                code: "edge_response_framing_header_forbidden",
                message: format!(
                    "edge_minimal short-circuit response may not author transport framing header {name:?}"
                ),
            });
        }
    }

'''
          text = text.replace(marker, guard + marker, 1)

          test_marker = '    #[tokio::test]\n    async fn short_circuit_response_is_returned_without_a_downstream_continuation() {'
          if text.count(test_marker) != 1:
              raise SystemExit('short-circuit test marker drifted')
          tests = '''    #[tokio::test]
    async fn informational_and_framing_control_short_circuits_fail_closed() {
        let informational = edge_minimal_middleware_fn(|_args| async move {
            Ok(EdgeMinimalDecision::Respond(StageResponse {
                status: 103,
                headers: BTreeMap::new(),
                body: Vec::new(),
            }))
        });
        let host = LocalEdgeMinimalHost::from_middleware(informational, deps());
        let mut request = MiddlewareHostRequest::new("GET", "/");
        request.trusted_transport_secure = true;
        let error = host
            .execute(request, context())
            .await
            .expect_err("informational response is not a final P2 short-circuit");
        assert_eq!(error.code, "invalid_edge_response_status");

        let framing = edge_minimal_middleware_fn(|_args| async move {
            Ok(EdgeMinimalDecision::Respond(StageResponse {
                status: 200,
                headers: BTreeMap::from([("content-length".to_owned(), "999".to_owned())]),
                body: b"ok".to_vec(),
            }))
        });
        let host = LocalEdgeMinimalHost::from_middleware(framing, deps());
        let mut request = MiddlewareHostRequest::new("GET", "/");
        request.trusted_transport_secure = true;
        let error = host
            .execute(request, context())
            .await
            .expect_err("P2 must not author transport body framing");
        assert_eq!(error.code, "edge_response_framing_header_forbidden");
    }

'''
          text = text.replace(test_marker, tests + test_marker, 1)
          host.write_text(text)
          PY
          cargo fmt --manifest-path src/rust/Cargo.toml --all
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'src/rust/src/hosts/edge_minimal_local.rs\nsrc/rust/src/provider_api.rs'
      - name: Verify focused Rust surface
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib --test host_abi_contract -- -D warnings
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib provider_api::tests -- --nocapture
          cargo test --locked --manifest-path src/rust/Cargo.toml --no-default-features --lib hosts::edge_minimal_local::tests -- --nocapture
          cargo fmt --manifest-path src/rust/Cargo.toml --all -- --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/rust/src/provider_api.rs src/rust/src/hosts/edge_minimal_local.rs
          git commit -m 'fix(rust): compile portable edge callback adapters'
          git push origin HEAD:fix/export-edge-provider-api-and-local-host-20260922
