name: ingress-rustfmt-autofix

on:
  push:
    branches:
      - hardening/tasks-028-031-ingress-contract

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Format ingress source only
        run: rustfmt --edition 2024 src/rust/src/frameworks/ingress.rs
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- src/rust/src/frameworks/ingress.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rust/src/frameworks/ingress.rs
          git commit -m "style: apply rustfmt to ingress contract"
          git push origin "HEAD:${GITHUB_REF_NAME}"
