name: Harden DEN-3959 full ORM matrix once

on:
  push:
    branches:
      - fix/den-3959-no-asymmetric-orm-gate
    paths:
      - .github/workflows/den-3959-no-asymmetric-orm-gate-once.yml

permissions:
  contents: write

concurrency:
  group: den-3959-no-asymmetric-orm-gate-once
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'ORESoftware/ores-middleware'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install PostgreSQL client and libpq
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev postgresql-client
      - name: Apply reviewed ORM entrypoint hardening
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/_apply_orm_gate_hardening.py
          python3 -m py_compile \
            scripts/orm_catalog_gate.py \
            scripts/orm_matrix_gate.py \
            scripts/check_zpkg.py \
            scripts/test_orm_catalog_gate.py
      - name: Run offline anti-regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            scripts/test_orm_catalog_gate.py \
            scripts/test_orm_matrix_gate.py \
            scripts/test_subprocess_capture.py \
            -v
          python3 scripts/check_zpkg.py
      - name: Prove compatibility command executes all four ORM lanes
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          python3 scripts/orm_catalog_gate.py \
            --output-root target/orm-entrypoint-alias \
            --report target/orm-entrypoint-alias/receipt.json
          jq -e '
            .schema == "ores.orm-catalog-convergence-report/v2" and
            .status == "passed" and
            .zeroUnexplainedFindings == true and
            (.discrepancies | length) == 0 and
            (.authorities == ["typespec", "json-schema-openapi"]) and
            (.ormManifests | keys | sort == [
              "json-schema-openapi-diesel",
              "json-schema-openapi-seaorm",
              "typespec-diesel",
              "typespec-seaorm"
            ])
          ' target/orm-entrypoint-alias/receipt.json
      - name: Commit only proven hardening and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/orm_catalog_gate.py \
            scripts/test_orm_catalog_gate.py \
            scripts/check_zpkg.py \
            docs/architecture.md
          git rm -- \
            .github/workflows/den-3959-no-asymmetric-orm-gate-once.yml \
            scripts/_apply_orm_gate_hardening.py
          unexpected="$(git diff --cached --name-only | grep -Ev '^(scripts/orm_catalog_gate.py|scripts/test_orm_catalog_gate.py|scripts/check_zpkg.py|docs/architecture.md|\.github/workflows/den-3959-no-asymmetric-orm-gate-once\.yml|scripts/_apply_orm_gate_hardening.py)$' || true)"
          test -z "$unexpected"
          git commit -m 'fix(DEN-3959): require Diesel and SeaORM for both authorities'
          git push origin HEAD:refs/heads/fix/den-3959-no-asymmetric-orm-gate
