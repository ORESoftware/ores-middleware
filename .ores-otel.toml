# Cross-runtime telemetry policy for the middleware library itself.
# Contract authority: ores-otel/ores-otel-interfaces OresOtelConfigV1.
# Credentials and exporter authorization values must remain in runtime env/secrets.
version = 1

[common]
enabled = true

[common.logging]
enabled = true
level = "info"
console = true
auto_send = false

[common.tracing]
enabled = true
sample_ratio = 0.1
propagators = ["tracecontext", "baggage"]

[common.metrics]
enabled = true

[server]
service_name = "ores-middleware"

[server.exporter]
protocol = "otlp_http"
endpoint_env = "OTEL_EXPORTER_OTLP_ENDPOINT"
