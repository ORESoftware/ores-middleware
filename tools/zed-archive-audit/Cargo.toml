[package]
name = "ores-zed-archive-audit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fail-closed reproducibility and contents audit for Zed package archives"
license = "MIT"
publish = false

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
tempfile = "3"

[workspace]
