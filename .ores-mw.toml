# Repository-local middleware orchestration. This is not a third schema authority:
# full stack configuration remains in peer-authority-validated JSON.
schema_version = 1
repository_mode = "server-only"
default_target = "portable-adapters"

[[targets]]
name = "portable-adapters"
role = "server"
roots = ["src"]
middleware = "stack"
stack_config = "contracts/fixtures/stack.minimal.json"
