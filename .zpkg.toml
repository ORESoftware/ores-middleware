[package]
org = "oresoftware"
name = "ores-middleware"
version = "0.1.0"
description = "Peer-authority, polyglot request-lifecycle middleware SDK for Rust, TypeScript, Go, Gleam, Elixir, and Erlang"
license = "MIT"
keywords = ["middleware", "polyglot", "typespec", "json-schema", "opentelemetry", "server"]
# Intentionally no package.language: this repository has six first-class
# language packages. Each [targets.*] entry declares its own package slice.

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-middleware"

[dependencies]
# Cross-repository runtime code is resolved through an immutable Zed artifact,
# never through an unauthenticated private Cargo Git URL. The frozen lock must
# bind version, digest, tag, source commit, archive format, size, and source.
"ores-rate-limit/ores-rl-lib-core" = "^0.1.0"

[build]
command = "python3 scripts/build_targets.py"
outputs = [
  "target/rust",
  "target/ts",
  "target/golang",
  "target/gleam",
  "target/elixir",
  "target/erlang",
  "target/package",
]

[install]
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
# r2g runs this after installing only the declared build outputs. The packaged
# script reruns the TypeSpec/JSON Schema cross-translation witness from copied,
# digest-bound evidence and executes all six installed runtime artifacts.
smoke_test = "python3 \"$ZED_PKG_TEST_TARGET/target/package/scripts/installed_package_smoke.py\" --root \"$ZED_PKG_TEST_TARGET\""
exclude = [
  ".env",
  ".env.*",
  ".direnv/**",
  ".zed/**",
  ".zed-pack/**",
  ".vendor/.zed/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/build/**",
  "**/_build/**",
  "**/deps/**",
  "tmp/**",
  "**/*.log",
  ".DS_Store",
]

# Canonical whole-repository artifact: both authored authorities, generators,
# conformance fixtures, every language source package, and operational docs.
[targets.repository]
dir = "."
adapter = "none"

[targets.rust]
dir = "src/rust"
name = "ores-middleware-rust"
adapter = "rust"

[targets.typescript]
dir = "src/ts"
name = "ores-middleware-typescript"
adapter = "node"

[targets.golang]
dir = "src/golang"
name = "ores-middleware-golang"
adapter = "go"

[targets.gleam]
dir = "src/gleam"
name = "ores-middleware-gleam"
adapter = "none"

[targets.elixir]
dir = "src/elixir"
name = "ores-middleware-elixir"
adapter = "none"

[targets.erlang]
dir = "src/erlang"
name = "ores-middleware-erlang"
adapter = "none"

[scripts]
# Zed 0.2.3 exposes one closed test hook. Richer commands live in package.json.
# This hook runs the repository audit plus independent generation/validation;
# the database-backed four-way ORM/catalog gate remains in service-enabled CI.
test = "python3 scripts/audit.py --receipt target/audit/receipt.json && npm run contracts:polyglot-generate && npm run contracts:generated-check"
