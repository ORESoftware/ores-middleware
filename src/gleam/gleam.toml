name = "ores_middleware"
version = "0.1.0"
target = "erlang"
description = "OTP-compatible ORES middleware contract and adapters"
licences = ["MIT"]
repository = { type = "github", user = "ORESoftware", repo = "ores-middleware" }
erlang_applications = ["crypto"]

[dependencies]
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
oresoftware_next_loggers = { git = "https://github.com/ores-otel/ores.otel.log.git", ref = "b55271c047be761c4711d87cbd500a49eefda3d9", path = "sdk/gleam" }

[dev-dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
