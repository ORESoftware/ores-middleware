[package]
name = "ores-middleware"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-framework ORES middleware contract and Rust adapters"
repository = "https://github.com/ORESoftware/ores-middleware"

[features]
default = ["axum", "compression"]
axum = ["dep:axum"]
compression = ["axum", "dep:tower-http"]
mash = ["axum"]
leptos = ["axum"]
dioxus = ["axum"]

[dependencies]
axum = { version = "0.8", optional = true }
futures-util = "0.3"
hmac = "0.12"
http = "1"
# Match ores-otel-web's source identity: one logger/context carrier and one
# compatible serde_json graph, rather than a second SDK at an older revision.
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log", rev = "74bc1c421f5a56be28cade1a47f5d45de51f3b4b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["compression-full"], optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ores-otel-web = { git = "https://github.com/ores-otel/ores.otel.log", rev = "74bc1c421f5a56be28cade1a47f5d45de51f3b4b", default-features = false, features = ["axum"] }

[[bin]]
name = "contractcheck"
path = "src/bin/contractcheck.rs"
